name: kudakeiran
description: اپلیکیشن آموزشی حرفه‌ای کودکان - کودک دانا | Smart Kid
publish_to: 'none'
version: 3.1.1+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # نسخه‌ها پین‌شده برای سازگاری قطعی با Flutter 3.24.3 (ورک‌فلوی بیلد)
  # نسخه‌های جدیدتر (مثل fl_chart 0.71) از API های Flutter 3.27 مثل
  # Color.withValues استفاده می‌کنند و بیلد را می‌شکنند
  cupertino_icons: 1.0.8
  google_fonts: 6.2.1
  flutter_animate: 4.5.2
  fl_chart: 0.69.2
  shared_preferences: 2.3.2
  confetti: 0.7.0
  url_launcher: 6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  flutter_launcher_icons: 0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFEB3B"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/hero_kids.png
    - assets/learn_world.png
    - assets/play_world.png
    - assets/explore_world.png
