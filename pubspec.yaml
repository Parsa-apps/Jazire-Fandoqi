name: jazireh_fandoghi
description: "جزیره فندقی - اپلیکیشن آموزشی آفلاین کودکان با شخصیت فندقی | سازنده: فرشاد پارسا"
publish_to: 'none'
version: 6.2.0+13

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 🎨 UI & Graphics
  google_fonts: 6.2.1
  flutter_animate: 4.5.2
  
  # 🎮 Game Engine
  flame: 1.18.0
  
  # 💾 Storage
  shared_preferences: 2.3.2
  
  # 🚀 State Management
  flutter_riverpod: 2.5.1
  
  # 📦 Database
  hive: 2.2.3
  hive_flutter: 1.1.0
  path_provider: 2.1.3
  image_picker: 1.1.2
  image_cropper: 8.0.2
  url_launcher: 6.3.1
  
  # 🔊 Audio & TTS
  just_audio: 0.9.40
  flutter_tts: 4.1.0

  # 🎬 Video playback (cartoons streamed from Iranian servers)
  video_player: 2.9.1
  http: 1.2.2
  
  # 🔐 Crypto (premium #2: AES-GCM encrypted .parsa backup)
  cryptography: 2.7.0
  
  # 🛠️ Debugging & Logging
  talker: 4.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 4.0.0
  flutter_launcher_icons: 0.13.1

dependency_overrides:
  # image_cropper_platform_interface 7.2.0 uses Color.toARGB32(), which only
  # exists on Flutter 3.27+; CI builds with 3.24.3, so pin the compatible 7.0.0.
  image_cropper_platform_interface: 7.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FF9A5C"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
    - assets/icons/app_icon_foreground.png
    - assets/hero_kids.webp
    - assets/learn_world.webp
    - assets/play_world.webp
    - assets/explore_world.webp
    - assets/gateway/
    - assets/illustrations/memory_cards.webp
    - assets/illustrations/fruits_cards.webp
    - assets/illustrations/animals_cards.webp
    - assets/illustrations/alphabet_world.webp
    - assets/illustrations/drawing_stickers.webp
    - assets/illustrations/colors_cards.webp
    - assets/illustrations/shapes_cards.webp
    - assets/illustrations/jobs_cards.webp
    - assets/illustrations/body_cards.webp
    - assets/mascot/
    - assets/avatars/
    - assets/premium/
    - assets/cartoons/
    - assets/stories/
    - assets/audio/stories/
    - assets/lullabies/
    - assets/audio/lullabies/
    - assets/audio/sfx/
    - assets/audio/bgm/
    - assets/audio/sound_match/
    - assets/audio/letters/
    - assets/audio/numbers/
    - assets/audio/learning/colors/
    - assets/audio/learning/shapes/

  # فاز ۷ (تکمیل): فونت محلی آفلاین — fallback واقعی برای GoogleFonts
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
