name: kudakeiran
description: Professional EdTech Startup for Kids.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  fl_chart: ^0.66.0
  shared_preferences: ^2.2.2
  confetti: ^0.7.0
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/hero_kids.png
    - assets/learn_world.png
    - assets/play_world.png
    - assets/explore_world.png
