name: Build APK & AAB - کودک دانا v3


on:
  push:
    branches: [ main, master, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # When KEYSTORE_B64 is present the release is signed with the project's
      # release key; when absent the build still succeeds (debug-signed,
      # non-publishable). See android/app/build.gradle + KEYSTORE_ROTATION_GUIDE.md.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      # ==================== FIX اصلی ====================
      - name: Ensure Android folder exists
        run: |
          if [ ! -d "android" ]; then
            echo "android folder not found. Creating..."
            flutter create . --platforms android
          else
            echo "android folder exists"
          fi

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      # ==================== کیفیت کد ====================
      # analyze روی lib/ و test/ اجرا می‌شود. در اولین اجرا عمداً
      # continue-on-error است تا وضعیت موجود دیده شود بدون اینکه CI قرمز شود؛
      # پس از پاک‌سازی هشدارها، این خط حذف و مرحله fatal می‌شود.
      - name: Flutter analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      # test/integration_test/app_flow_test.dart از IntegrationTestWidgetsFlutterBinding
      # استفاده می‌کند و به دستگاه/امولاتور نیاز دارد، پس عمداً از این مرحله کنار
      # گذاشته شده و مسیرهای headless-safe به‌صورت صریح داده می‌شوند.
      - name: Flutter test (headless suites)
        run: |
          flutter test \
            test/app_smoke_test.dart \
            test/core \
            test/features \
            test/shared

      - name: Configure release signing
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Restore the release keystore from the GitHub Secret.
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release.keystore
          chmod 600 android/release.keystore
          # build.gradle resolves storeFile relative to android/ (rootProject),
          # so key.properties is written there and points at release.keystore.
          # PKCS12 uses one password for store-integrity and key encryption, so
          # storePassword == keyPassword; alias is the fixed release-key identity.
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=fandoghi"
            echo "keyPassword=${KEYSTORE_PASSWORD}"
          } > android/key.properties
          chmod 600 android/key.properties
          echo "Release signing configured from GitHub Secrets."

      # ==================== بیلدهای Release ====================
      # ۱) APK یونیورسال — فقط برای تست دستی/نصب مستقیم روی هر دستگاه.
      #    سمبل‌های دیباگ جدا می‌شوند تا stack trace قابل رمزگشایی بماند.
      - name: Build universal APK (Release, obfuscated)
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols/apk-universal
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/dist/app-universal-release.apk

      # ۲) APK های تفکیک‌شده بر اساس ABI — خروجی قابل انتشار، حجم بسیار کمتر.
      #    این مرحله app-release.apk را بازنویسی نمی‌کند اما نسخه‌ی یونیورسال
      #    از قبل در build/dist کپی شده تا از هر تداخلی مصون بماند.
      - name: Build split-per-ABI APKs (Release, obfuscated)
        run: |
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols/apk-split

      - name: Verify release signing (all APKs)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          set -euo pipefail
          APS="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          test -n "$APS" || { echo "apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }

          # همه‌ی APK های تولیدشده (یونیورسال + هر ABI) باید با گواهی release
          # امضا شده باشند؛ اگر حتی یکی رد شود کل مرحله fail می‌شود.
          COUNT=0
          for APK in build/dist/app-universal-release.apk \
                     build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$APK" ] || continue
            echo "──────── verifying: $APK"
            "$APS" verify --print-certs "$APK"
            COUNT=$((COUNT + 1))
          done
          test "$COUNT" -ge 2 || { echo "expected at least 2 APKs to verify, found $COUNT"; exit 1; }
          echo "All $COUNT APKs verified: signed with the release certificate."

      # ۳) AAB — خروجی رسمی فروشگاه. تفکیک ABI/زبان/چگالی از قبل در
      #    android/app/build.gradle فعال است، پس اینجا فقط obfuscate اضافه می‌شود.
      - name: Build AAB (Release, obfuscated)
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/aab

      # ==================== گزارش حجم خروجی‌ها ====================
      - name: Report artifact sizes
        run: |
          set -euo pipefail
          {
            echo "### 📦 حجم خروجی‌های Release"
            echo ""
            echo "| فایل | بایت | مگابایت |"
            echo "|---|---:|---:|"
            for F in build/dist/app-universal-release.apk \
                     build/app/outputs/flutter-apk/app-*-release.apk \
                     build/app/outputs/bundle/release/app-release.aab; do
              [ -f "$F" ] || continue
              B=$(stat -c%s "$F")
              M=$(awk -v b="$B" 'BEGIN{printf "%.2f", b/1048576}')
              printf '| `%s` | %s | %s |\n' "$(basename "$F")" "$B" "$M"
            done
            echo ""
            echo "خط پایه پیش از بهینه‌سازی (اجرای 31744876056): APK یونیورسال 51,619,767 بایت (49.23 MiB) / AAB 52,477,188 بایت (50.05 MiB)."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      # ==================== آپلود آرتیفکت‌ها ====================
      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: kudake_iran_v3.0.0_apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      - name: Upload universal APK (testing only)
        uses: actions/upload-artifact@v4
        with:
          name: kudake_iran_v3.0.0_apk_universal
          path: build/dist/app-universal-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kudake_iran_v3.0.0_aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # سمبل‌های دیباگ برای رمزگشایی stack trace نسخه‌ی obfuscate‌شده.
      # بدون این آرتیفکت، کرش‌ریپورت‌های نسخه‌ی release غیرقابل خواندن می‌شوند.
      - name: Upload debug symbols (for crash de-obfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: kudake_iran_v3.0.0_debug_symbols
          path: build/symbols/
          if-no-files-found: error
          retention-days: 90
