<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیش‌نمایش جزیره فندقی (ماجراجویی)</title>
<style>
  body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; overflow-y: hidden;}
  
  /* فریم گوشی موبایل */
  .phone { 
    width: 380px; 
    height: 760px; 
    background: #EAF8FF; /* IslandWorldPalette.skyMist */
    overflow-y: auto; 
    overflow-x: hidden;
    position: relative; 
    border: 14px solid #111; 
    border-radius: 40px; 
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    scrollbar-width: none;
  }
  .phone::-webkit-scrollbar { display: none; }
  
  /* کانتینر نقشه با ارتفاع زیاد برای اسکرول */
  .map-container {
    height: 1600px;
    position: relative;
    width: 100%;
  }

  /* اقیانوس بالا */
  .ocean { 
    position: absolute; top: 0; left: 0; width: 100%; height: 350px; 
    background: linear-gradient(to bottom, #4FACFE, #39BBD4); /* IslandWorldGradients.ocean */
  }
  
  /* موج‌های ساحل */
  .shore {
    position: absolute; top: 330px; left: -10%; width: 120%; height: 60px;
    background: #FFFDF7;
    border-radius: 50% 50% 0 0;
    filter: blur(2px);
  }

  /* بدنه اصلی جزیره */
  .island { 
    position: absolute; top: 350px; left: 5%; width: 90%; height: 1200px; 
    background: linear-gradient(to bottom, rgba(255, 201, 77, 0.4) 0%, #9BDD69 15%, #47B96D 50%, #287A58 100%); 
    border-radius: 60px; 
    border-bottom: 25px solid #5D4037; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  
  /* مسیر (Path) */
  .path-wrap {
    position: absolute; top: 380px; left: 0; width: 100%; height: 1100px;
  }
  svg.path-line {
    width: 100%; height: 100%;
  }
  
  /* استایل مناطق */
  .region { 
    position: absolute; left: 0; right: 0; text-align: center; 
    font-weight: 900; font-size: 18px; 
    background: rgba(255,255,255,0.92); 
    padding: 8px 20px; border-radius: 20px; 
    width: max-content; margin: 0 auto; 
    border: 3px solid; 
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    z-index: 10;
  }
  
  /* استایل نمادهای بازی */
  .landmark { 
    position: absolute; display: flex; flex-direction: column; align-items: center; 
    width: 120px; transform: translateX(50%); z-index: 5;
    transition: transform 0.2s; cursor: pointer;
  }
  .landmark:hover { transform: translateX(50%) scale(1.1) translateY(-10px); }
  
  .circle { 
    width: 70px; height: 70px; background: white; border-radius: 50%; 
    display: flex; justify-content: center; align-items: center; 
    font-size: 36px; border: 4px solid; 
    box-shadow: 0 6px 15px rgba(0,0,0,0.25); 
  }
  .label { 
    margin-top: -10px; padding: 4px 12px; border-radius: 12px; 
    color: white; font-size: 13px; font-weight: bold; 
    border: 2px solid white; text-align: center; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    z-index: 2;
  }

  /* فندقی (Hero) */
  .fandoghi { 
    position: absolute; bottom: 30px; left: 50%; transform: translateX(50%); 
    width: 120px; z-index: 20;
    animation: breathe 3s infinite alternate;
  }
  .fandoghi img { width: 100%; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); }
  
  @keyframes breathe {
    0% { transform: translateX(50%) scale(1) translateY(0); }
    100% { transform: translateX(50%) scale(1.05) translateY(-8px); }
  }

  /* ابرهای متحرک */
  .cloud {
    position: absolute; background: white; border-radius: 50px; opacity: 0.8;
    filter: blur(1px); animation: float linear infinite;
  }
  @keyframes float {
    from { transform: translateX(-150px); }
    to { transform: translateX(450px); }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="map-container">
      
      <!-- آسمان و اقیانوس -->
      <div class="ocean"></div>
      <div class="cloud" style="width: 80px; height: 30px; top: 50px; left: 0; animation-duration: 40s;"></div>
      <div class="cloud" style="width: 120px; height: 40px; top: 120px; left: -50px; animation-duration: 35s; animation-delay: -10s;"></div>
      <div class="cloud" style="width: 60px; height: 25px; top: 220px; left: 50px; animation-duration: 50s;"></div>
      <div class="shore"></div>
      
      <!-- جزیره -->
      <div class="island"></div>
      
      <!-- مسیر روی نقشه -->
      <div class="path-wrap">
        <svg class="path-line" viewBox="0 0 100 100" preserveAspectRatio="none">
          <path d="M 50,5 Q 80,15 40,25 T 50,45 Q 80,55 30,65 T 50,85 Q 70,95 50,100" 
                fill="none" stroke="rgba(255, 250, 239, 0.8)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1, 2"/>
        </svg>
      </div>

      <!-- منطقه ۱: ساحل سرگرمی -->
      <div class="region" style="top: 360px; color: #39BBD4; border-color: #39BBD4;">ساحل سرگرمی</div>
      <div class="landmark" style="top: 420px; right: 25%;">
        <div class="circle" style="border-color: #EE91B5;">🎪</div>
        <div class="label" style="background: #EE91B5;">بازی‌های تازه</div>
      </div>
      <div class="landmark" style="top: 500px; right: 65%;">
        <div class="circle" style="border-color: #68C9F1;">🫧</div>
        <div class="label" style="background: #68C9F1;">حباب‌ترکان</div>
      </div>
      <div class="landmark" style="top: 580px; right: 30%;">
        <div class="circle" style="border-color: #FFC94D;">⭐</div>
        <div class="label" style="background: #FFC94D;">ستاره‌گیری</div>
      </div>

      <!-- منطقه ۲: کارگاه خلاقیت -->
      <div class="region" style="top: 680px; color: #9984E8; border-color: #9984E8;">کارگاه خلاقیت</div>
      <div class="landmark" style="top: 740px; right: 65%;">
        <div class="circle" style="border-color: #F47B64;">🎨</div>
        <div class="label" style="background: #F47B64;">دفتر نقاشی</div>
      </div>
      <div class="landmark" style="top: 820px; right: 25%;">
        <div class="circle" style="border-color: #68C9F1;">🧪</div>
        <div class="label" style="background: #68C9F1;">رنگ‌ها</div>
      </div>
      <div class="landmark" style="top: 900px; right: 70%;">
        <div class="circle" style="border-color: #FFC94D;">🧩</div>
        <div class="label" style="background: #FFC94D;">پازل</div>
      </div>

      <!-- منطقه ۳: جنگل ریاضی -->
      <div class="region" style="top: 1020px; color: #287A58; border-color: #287A58;">جنگل ریاضی</div>
      <div class="landmark" style="top: 1080px; right: 30%;">
        <div class="circle" style="border-color: #EE91B5;">🏎️</div>
        <div class="label" style="background: #EE91B5;">ریاضی</div>
      </div>
      <div class="landmark" style="top: 1160px; right: 65%;">
        <div class="circle" style="border-color: #68C9F1;">🕒</div>
        <div class="label" style="background: #68C9F1;">ساعت</div>
      </div>
      <div class="landmark" style="top: 1240px; right: 25%;">
        <div class="circle" style="border-color: #47B96D;">🐊</div>
        <div class="label" style="background: #47B96D;">تمساح</div>
      </div>

      <!-- منطقه ۴: روستای الفبا -->
      <div class="region" style="top: 1360px; color: #2C9B67; border-color: #2C9B67;">روستای الفبا</div>
      <div class="landmark" style="top: 1420px; right: 75%;">
        <div class="circle" style="border-color: #FFC94D;">🔤</div>
        <div class="label" style="background: #FFC94D;">حروف</div>
      </div>
      <div class="landmark" style="top: 1480px; right: 25%;">
        <div class="circle" style="border-color: #39BBD4;">📖</div>
        <div class="label" style="background: #39BBD4;">قصه‌ها</div>
      </div>
      
      <!-- فندقی در پایین مسیر -->
      <div class="fandoghi">
        <!-- استفاده از فایل واقعی مسکات از داخل سورس برنامه شما -->
        <img src="assets/mascot/fandoghi_baby.webp" alt="فندقی" onerror="this.src='https://cdn3d.iconscout.com/3d/premium/thumb/cute-baby-boy-4993883-4161109.png'"/>
      </div>
    </div>
  </div>
</body>
</html>
