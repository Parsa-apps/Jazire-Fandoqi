workflows:
  android-release:
    name: Android Release (APK + AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.parsaapps.kudakeiran"
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Ensure Android folder exists
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android \
              --project-name kudakeiran --org com.parsaapps
          fi
      - name: Flutter pub get
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Flutter analyze (non-blocking)
        script: flutter analyze || echo "Analyze finished with issues (non-blocking)"
      - name: Build APK (Release)
        script: flutter build apk --release
      - name: Build AAB (Release)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
