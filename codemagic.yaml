workflows:
  android-release:
    name: Android release validation
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.24.3
      java: 17
      vars:
        PACKAGE_NAME: "com.parsaapps.kudakeiran"
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '**'
          include: true
    scripts:
      - name: Generate Android platform shell
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android \
              --project-name amoozesh_fandoghi --org com.parsaapps
          fi
      - name: Flutter pub get
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos
      - name: Flutter tests
        script: flutter test
      - name: Build APK (release)
        script: flutter build apk --release
      - name: Build AAB (release)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
