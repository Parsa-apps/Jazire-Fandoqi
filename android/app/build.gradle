plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Signing secrets stay local (android/key.properties) or are created from CI secrets.
// A release without this file remains unsigned; it is suitable only for build
// verification and must never be submitted to an app store.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()
def verificationSigningRequested = providers.gradleProperty("allowVerificationSigning")
    .getOrElse("false")
    .toBoolean()
def allowVerificationSigning = verificationSigningRequested ||
    System.getenv("GITHUB_ACTIONS") == "true"
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Bazaar's RSA public key identifies and protects purchase responses. It is
// public by design, but kept out of source so each release can be configured
// from the store dashboard without a code change.
def billingProperties = new Properties()
def billingPropertiesFile = rootProject.file("billing.properties")
if (billingPropertiesFile.exists()) {
    billingPropertiesFile.withInputStream { billingProperties.load(it) }
}
def bazaarRsaPublicKey = billingProperties.getProperty("bazaarRsaPublicKey", "")

// 🛡️ Anti-tamper: embed the SHA-256 digest of the release signing certificate
// into BuildConfig. At runtime the app compares the installed APK's own
// signature against this digest and refuses to run when they differ — a
// repackaged APK is always signed with a different certificate.
// CI / verification builds (no key.properties) embed an empty digest, which
// disables the check; they are not publishable artifacts.
def releaseSigningSha256 = ""
if (hasReleaseSigning) {
    try {
        def storeFile = file(keystoreProperties['storeFile'])
        if (storeFile.exists()) {
            def storePass = (keystoreProperties['storePassword'] as String).toCharArray()
            def alias = keystoreProperties['keyAlias'] as String
            def fileBytes = storeFile.bytes
            def cert = null
            ['PKCS12', 'JKS'].any { storeType ->
                try {
                    def ks = java.security.KeyStore.getInstance(storeType)
                    def bis = new java.io.ByteArrayInputStream(fileBytes)
                    ks.load(bis, storePass)
                    cert = ks.getCertificate(alias)
                    return true
                } catch (Exception e) {
                    return false
                }
            }
            if (cert != null) {
                def md = java.security.MessageDigest.getInstance("SHA-256")
                releaseSigningSha256 = md.digest(cert.getEncoded())
                    .collect { String.format("%02x", it) }
                    .join("")
            }
        }
    } catch (Exception ignored) {
        releaseSigningSha256 = ""
    }
}

android {
    namespace = "com.parsaapps.amoozesh_fandoghi"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    // AGP 8 no longer generates BuildConfig by default; the Bazaar billing
    // bridge reads its RSA public key from BuildConfig, so it must be enabled.
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    // Flutter plugins and the minSdk 21 / Keystore API 23 mix trip AGP's
    // lintVitalRelease (NewApi / manifest merger leftovers). That task is not
    // a compile check — it was aborting assembleRelease after the Kotlin
    // already compiled. Keep regular compile errors; don't fail the store
    // artifact on advisory lint.
    // lintOptions is the AGP 8.1 Groovy name; `lint {}` is AGP 8.2+ only.
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'InvalidPackage', 'NewApi'
    }

    defaultConfig {
        applicationId = "com.parsaapps.amoozesh_fandoghi"
        // Required by just_audio and other modern plugins
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        // حجم: فقط زبان فارسی/انگلیسی نگه داشته شود (حذف localeهای اضافی google_fonts و ...)
        resConfigs "en", "fa"
        buildConfigField "String", "BAZAAR_RSA_PUBLIC_KEY", "\"${bazaarRsaPublicKey.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "String", "EXPECTED_SIGNING_SHA256", "\"${releaseSigningSha256}\""
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    // فاز بهینه‌سازی حجم: حذف منابع استفاده‌نشده و فشرده‌سازی بیشتر
    packagingOptions {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }

    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    buildTypes {
        release {
            // Professional build optimization: minify + shrink resources
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Store releases must use key.properties. Debug signing is restricted to
            // GitHub Actions or an explicit non-publishable verification build.
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            } else if (allowVerificationSigning) {
                signingConfig = signingConfigs.debug
            } else {
                signingConfig = null
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseRequested = taskGraph.allTasks.any { task ->
        task.path == ":app:assembleRelease" || task.path == ":app:bundleRelease"
    }
    if (releaseRequested && !hasReleaseSigning && !allowVerificationSigning) {
        throw new GradleException(
            "Release signing is not configured. Add android/key.properties, " +
            "or explicitly enable allowVerificationSigning for a non-publishable CI artifact."
        )
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Poolakey is the official open-source Cafe Bazaar billing client.
    implementation "com.github.cafebazaar.Poolakey:poolakey:2.2.0"
    // AppCompat for uCrop Activity & theme support
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.annotation:annotation:1.7.1"
}
