plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Signing secrets stay local (android/key.properties) or are created from CI secrets.
// A release without this file remains unsigned; it is suitable only for build
// verification and must never be submitted to an app store.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()
def verificationSigningRequested = providers.gradleProperty("allowVerificationSigning")
    .getOrElse("false")
    .toBoolean()
def allowVerificationSigning = verificationSigningRequested ||
    System.getenv("GITHUB_ACTIONS") == "true"
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Each store's RSA public key identifies and protects that store's purchase
// responses. They are public by design, but kept out of source so a release
// can be configured from the store dashboards without a code change.
// A single APK carries both keys and picks the right gateway at runtime.
def billingProperties = new Properties()
def billingPropertiesFile = rootProject.file("billing.properties")
if (billingPropertiesFile.exists()) {
    billingPropertiesFile.withInputStream { billingProperties.load(it) }
}
def bazaarRsaPublicKey = billingProperties.getProperty("bazaarRsaPublicKey", "")
def myketRsaPublicKey = billingProperties.getProperty("myketRsaPublicKey", "")

// 🛡️ Anti-tamper: embed the SHA-256 digest of the release signing certificate
// into BuildConfig. At runtime the app compares the installed APK's own
// signature against this digest and refuses to run when they differ — a
// repackaged APK is always signed with a different certificate.
// CI / verification builds (no key.properties) embed an empty digest, which
// disables the check; they are not publishable artifacts.
def releaseSigningSha256 = ""
if (hasReleaseSigning) {
    try {
        // storeFile در key.properties ممکن است نسبی باشد؛ مبنای آن پوشهٔ
        // key.properties (android/) است، نه پوشهٔ پروژه (android/app/).
        def storeFileValue = keystoreProperties['storeFile'] as String
        def resolvedStoreFile = new File(storeFileValue)
        if (!resolvedStoreFile.isAbsolute()) {
            resolvedStoreFile = new File(keystorePropertiesFile.parentFile, storeFileValue)
        }
        if (resolvedStoreFile.exists()) {
            def storePass = (keystoreProperties['storePassword'] as String).toCharArray()
            def alias = keystoreProperties['keyAlias'] as String
            def fileBytes = resolvedStoreFile.bytes
            def cert = null
            ['PKCS12', 'JKS'].any { storeType ->
                try {
                    def ks = java.security.KeyStore.getInstance(storeType)
                    def bis = new java.io.ByteArrayInputStream(fileBytes)
                    ks.load(bis, storePass)
                    cert = ks.getCertificate(alias)
                    return true
                } catch (Exception e) {
                    return false
                }
            }
            if (cert != null) {
                def md = java.security.MessageDigest.getInstance("SHA-256")
                releaseSigningSha256 = md.digest(cert.getEncoded())
                    .collect { String.format("%02x", it & 0xff) }
                    .join("")
            }
        }
    } catch (Exception ignored) {
        releaseSigningSha256 = ""
    }
}

android {
    namespace = "com.parsaapps.amoozesh_fandoghi"
    compileSdk = 35
    // CI (ubuntu-latest) runners preinstall a fixed set of NDKs.
    // flutter.ndkVersion (23.1.7779620 on Flutter 3.24.3) is no longer among
    // them and its on-demand download was failing the release build; use the
    // runner's default NDK instead. The app contains no native code — the NDK
    // is only used by AGP to strip bundled plugin symbols.
    ndkVersion = "27.3.13750724"

    // AGP 8 no longer generates BuildConfig by default; the Bazaar billing
    // bridge reads its RSA public key from BuildConfig, so it must be enabled.
    buildFeatures {
        buildConfig = true
    }

    // Java 17: the Myket billing AAR is compiled with Java 17 bytecode, so the
    // app module must be able to consume it. CI runs on temurin JDK 17.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Flutter plugins and the minSdk 21 / Keystore API 23 mix trip AGP's
    // lintVitalRelease (NewApi / manifest merger leftovers). That task is not
    // a compile check — it was aborting assembleRelease after the Kotlin
    // already compiled. Keep regular compile errors; don't fail the store
    // artifact on advisory lint.
    // `lint {}` is the AGP 8.2+ DSL (the old `lintOptions` name is deprecated).
    lint {
        checkReleaseBuilds false
        abortOnError false
        disable += ['InvalidPackage', 'NewApi']
    }

    defaultConfig {
        applicationId = "com.parsaapps.amoozesh_fandoghi"
        // Required by just_audio and other modern plugins
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        // حجم: فقط زبان فارسی/انگلیسی نگه داشته شود (حذف localeهای اضافی google_fonts و ...)
        resConfigs "en", "fa"
        buildConfigField "String", "BAZAAR_RSA_PUBLIC_KEY", "\"${bazaarRsaPublicKey.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "String", "MYKET_RSA_PUBLIC_KEY", "\"${myketRsaPublicKey.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "String", "EXPECTED_SIGNING_SHA256", "\"${releaseSigningSha256}\""

        // Myket Billing Client reads these from the merged manifest to find the
        // store service. They are plain identifiers, not secrets.
        manifestPlaceholders += [
            marketApplicationId: "ir.mservices.market",
            marketBindAddress  : "ir.mservices.market.InAppBillingService.BIND",
            marketPermission   : "ir.mservices.market.BILLING",
        ]
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    // فاز بهینه‌سازی حجم: حذف منابع استفاده‌نشده و فشرده‌سازی بیشتر
    packagingOptions {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }

    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    buildTypes {
        release {
            // Professional build optimization: minify + shrink resources
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Store releases must use key.properties. Debug signing is restricted to
            // GitHub Actions or an explicit non-publishable verification build.
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            } else if (allowVerificationSigning) {
                signingConfig = signingConfigs.debug
            } else {
                signingConfig = null
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseRequested = taskGraph.allTasks.any { task ->
        task.path == ":app:assembleRelease" || task.path == ":app:bundleRelease"
    }
    if (releaseRequested && !hasReleaseSigning && !allowVerificationSigning) {
        throw new GradleException(
            "Release signing is not configured. Add android/key.properties, " +
            "or explicitly enable allowVerificationSigning for a non-publishable CI artifact."
        )
    }
}

flutter {
    source = "../.."
}

// GitHub release builds are also the project's automated QA runner. Keeping
// this dependency next to the Android release tasks ensures analyzer errors or
// failing Flutter tests can never produce a distributable artifact, even when
// the workflow itself only invokes `flutter build`.
if (System.getenv("GITHUB_ACTIONS") == "true") {
    def flutterExecutable = new File(System.getenv("FLUTTER_ROOT"), "bin/flutter")
    def qualityMarker = rootProject.file("../build/ci-quality-gate.ok")
    def ciQualityGate = tasks.register("ciQualityGate", Exec) {
        group = "verification"
        description = "Runs Flutter analysis and the complete automated test suite."
        workingDir rootProject.file("..")
        inputs.files(rootProject.fileTree("../lib") { include "**/*.dart" })
        inputs.files(rootProject.fileTree("../test") { include "**/*.dart" })
        inputs.file(rootProject.file("../pubspec.yaml"))
        inputs.file(rootProject.file("../pubspec.lock"))
        outputs.file(qualityMarker)
        environment "FLUTTER_ALREADY_LOCKED", "true"
        environment "PATH", "${flutterExecutable.parentFile.absolutePath}:${System.getenv('PATH')}"
        commandLine "bash", rootProject.file("../tool/ci_quality_gate.sh").absolutePath
        doLast {
            qualityMarker.parentFile.mkdirs()
            qualityMarker.text = "passed\n"
        }
    }
    tasks.matching { it.name == "assembleRelease" || it.name == "bundleRelease" }
        .configureEach { dependsOn(ciQualityGate) }
}

dependencies {
    // Poolakey is the official open-source Cafe Bazaar billing client.
    implementation "com.github.cafebazaar.Poolakey:poolakey:2.2.0"
    // Myket's official open-source billing client (same JitPack repo).
    // The ads-identifier transitive dependency is excluded: this is a kids app
    // with a "no advertising ID, no tracking" privacy promise, and the billing
    // flow does not need it.
    implementation("com.github.myketstore:myket-billing-client:1.19") {
        exclude group: "com.google.android.gms", module: "play-services-ads-identifier"
    }
    // AppCompat for uCrop Activity & theme support
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.annotation:annotation:1.7.1"
}
