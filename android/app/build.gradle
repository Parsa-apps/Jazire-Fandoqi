import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipInputStream
import java.util.zip.ZipOutputStream

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Production releases are never debug-signed. QA runs unit/widget tests and
// native compilation without publishing an installable APK.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Each store's RSA public key identifies and protects that store's purchase
// responses. They are public by design, but kept out of source so a release
// can be configured from the store dashboards without a code change.
// A single APK carries both keys and picks the right gateway at runtime.
def billingProperties = new Properties()
def billingPropertiesFile = rootProject.file("billing.properties")
if (billingPropertiesFile.exists()) {
    billingPropertiesFile.withInputStream { billingProperties.load(it) }
}
def bazaarRsaPublicKey = billingProperties.getProperty("bazaarRsaPublicKey", "")
def myketRsaPublicKey = billingProperties.getProperty("myketRsaPublicKey", "")

// 🛡️ Anti-tamper: embed the SHA-256 digest of the release signing certificate
// into BuildConfig. At runtime the app compares the installed APK's own
// signature against this digest and refuses to run when they differ — a
// repackaged APK is always signed with a different certificate.
// Unit-test/debug compilations without key.properties embed an empty digest.
// Billing rejects those builds; release packaging itself fails without a key.
def releaseSigningSha256 = ""
def usesAndroidDebugCertificate = false
if (hasReleaseSigning) {
    try {
        // storeFile در key.properties ممکن است نسبی باشد؛ مبنای آن پوشهٔ
        // key.properties (android/) است، نه پوشهٔ پروژه (android/app/).
        def storeFileValue = keystoreProperties['storeFile'] as String
        def resolvedStoreFile = new File(storeFileValue)
        if (!resolvedStoreFile.isAbsolute()) {
            resolvedStoreFile = new File(keystorePropertiesFile.parentFile, storeFileValue)
        }
        if (resolvedStoreFile.exists()) {
            def storePass = (keystoreProperties['storePassword'] as String).toCharArray()
            def alias = keystoreProperties['keyAlias'] as String
            def fileBytes = resolvedStoreFile.bytes
            def cert = null
            ['PKCS12', 'JKS'].any { storeType ->
                try {
                    def ks = java.security.KeyStore.getInstance(storeType)
                    def bis = new java.io.ByteArrayInputStream(fileBytes)
                    ks.load(bis, storePass)
                    cert = ks.getCertificate(alias)
                    return true
                } catch (Exception e) {
                    return false
                }
            }
            if (cert != null) {
                usesAndroidDebugCertificate =
                    cert.subjectX500Principal.name.toLowerCase().contains("cn=android debug") ||
                    alias.equalsIgnoreCase("androiddebugkey")
                def md = java.security.MessageDigest.getInstance("SHA-256")
                releaseSigningSha256 = md.digest(cert.getEncoded())
                    .collect { String.format("%02x", it & 0xff) }
                    .join("")
            }
        }
    } catch (Exception ignored) {
        releaseSigningSha256 = ""
    }
}

android {
    namespace = "com.parsaapps.amoozesh_fandoghi"
    compileSdk = 35
    // CI (ubuntu-latest) runners preinstall a fixed set of NDKs.
    // flutter.ndkVersion (23.1.7779620 on Flutter 3.24.3) is no longer among
    // them and its on-demand download was failing the release build; use the
    // runner's default NDK instead. The app contains no native code — the NDK
    // is only used by AGP to strip bundled plugin symbols.
    ndkVersion = "27.3.13750724"

    // AGP 8 no longer generates BuildConfig by default; the Bazaar billing
    // bridge reads its RSA public key from BuildConfig, so it must be enabled.
    buildFeatures {
        buildConfig = true
    }

    // Java 17: the Myket billing AAR is compiled with Java 17 bytecode, so the
    // app module must be able to consume it. CI runs on temurin JDK 17.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Flutter plugins and the minSdk 21 / Keystore API 23 mix trip AGP's
    // lintVitalRelease (NewApi / manifest merger leftovers). That task is not
    // a compile check — it was aborting assembleRelease after the Kotlin
    // already compiled. Keep regular compile errors; don't fail the store
    // artifact on advisory lint.
    // `lint {}` is the AGP 8.2+ DSL (the old `lintOptions` name is deprecated).
    lint {
        checkReleaseBuilds false
        abortOnError false
        disable += ['InvalidPackage', 'NewApi']
    }

    defaultConfig {
        applicationId = "com.parsaapps.amoozesh_fandoghi"
        // Required by just_audio and other modern plugins
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        // حجم: فقط زبان فارسی/انگلیسی نگه داشته شود (حذف localeهای اضافی google_fonts و ...)
        resConfigs "en", "fa"
        buildConfigField "String", "BAZAAR_RSA_PUBLIC_KEY", "\"${bazaarRsaPublicKey.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "String", "MYKET_RSA_PUBLIC_KEY", "\"${myketRsaPublicKey.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "String", "EXPECTED_SIGNING_SHA256", "\"${releaseSigningSha256}\""

        // Myket Billing Client reads these from the merged manifest to find the
        // store service. They are plain identifiers, not secrets.
        manifestPlaceholders += [
            marketApplicationId: "ir.mservices.market",
            marketBindAddress  : "ir.mservices.market.InAppBillingService.BIND",
            marketPermission   : "ir.mservices.market.BILLING",
        ]
    }

    // Store APKs must not expose a competing market's billing permission.
    // Poolakey contributes PAY_THROUGH_BAZAAR from its AAR, while the Myket
    // client needs ir.mservices.market.BILLING. Flavor manifest overlays keep
    // only the permission accepted by the destination store.
    flavorDimensions += "store"
    productFlavors {
        bazaar {
            dimension "store"
            buildConfigField "String", "STORE_CHANNEL", '"bazaar"'
        }
        myket {
            dimension "store"
            buildConfigField "String", "STORE_CHANNEL", '"myket"'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    // فاز بهینه‌سازی حجم: حذف منابع استفاده‌نشده و فشرده‌سازی بیشتر
    packagingOptions {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }

    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    buildTypes {
        release {
            // Professional build optimization: minify + shrink resources
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            // Missing production credentials is an error, never a debug fallback.
            signingConfig = hasReleaseSigning ? signingConfigs.release : null
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseRequested = taskGraph.allTasks.any { task ->
        task.path ==~ /:app:(assemble|bundle).*Release/
    }
    if (releaseRequested) {
        if (!hasReleaseSigning || !(releaseSigningSha256 ==~ /[0-9a-f]{64}/) ||
            usesAndroidDebugCertificate) {
            throw new GradleException(
                "Official release signing is required. Debug/verification signing cannot produce a release."
            )
        }
        try {
            def encoded = java.util.Base64.decoder.decode(myketRsaPublicKey)
            java.security.KeyFactory.getInstance("RSA").generatePublic(
                new java.security.spec.X509EncodedKeySpec(encoded)
            )
        } catch (Exception ignored) {
            throw new GradleException("A valid Myket RSA public key is required for production billing.")
        }
    }
}

flutter {
    source = "../.."
}

// ---------------------------------------------------------------------
// Backward-compatible release entry points
// ---------------------------------------------------------------------
// Legacy CLI entry points keep Myket as their default output. The official
// workflow explicitly selects --flavor myket and uses the flavored paths.
def firstExistingFile(List<File> candidates) {
    return candidates.find { it != null && it.exists() }
}

tasks.matching { it.name == "assembleRelease" || it.name == "assembleMyketRelease" }.configureEach {
    doLast {
        def flutterApkDir = layout.buildDirectory.dir("outputs/flutter-apk").get().asFile
        def agpApkDir = layout.buildDirectory.dir("outputs/apk/myket/release").get().asFile
        def sourceApk = firstExistingFile([
            new File(flutterApkDir, "app-myket-release.apk"),
            new File(agpApkDir, "app-myket-release.apk"),
            new File(agpApkDir, "app-myket-release-unsigned.apk"),
        ])
        def legacyApk = new File(flutterApkDir, "app-release.apk")
        if (sourceApk == null) {
            throw new GradleException(
                "Expected Myket APK was not produced under ${flutterApkDir} or ${agpApkDir}"
            )
        }
        copy {
            from sourceApk
            into legacyApk.parentFile
            rename { legacyApk.name }
        }
        logger.lifecycle("Compatibility APK: ${legacyApk} (from ${sourceApk.name})")
    }
}

tasks.matching { it.name == "bundleRelease" || it.name == "bundleMyketRelease" }.configureEach {
    doLast {
        def myketBundleDir = layout.buildDirectory.dir("outputs/bundle/myketRelease").get().asFile
        def releaseBundleDir = layout.buildDirectory.dir("outputs/bundle/release").get().asFile
        def sourceAab = firstExistingFile([
            new File(myketBundleDir, "app-myket-release.aab"),
            new File(myketBundleDir, "app.aab"),
            new File(releaseBundleDir, "app-myket-release.aab"),
        ])
        def legacyAab = new File(releaseBundleDir, "app-release.aab")
        if (sourceAab == null) {
            throw new GradleException(
                "Expected Myket AAB was not produced under ${myketBundleDir}"
            )
        }
        copy {
            from sourceAab
            into legacyAab.parentFile
            rename { legacyAab.name }
        }
        logger.lifecycle("Compatibility AAB: ${legacyAab} (from ${sourceAab.name})")
    }
}

// GitHub release builds are also the project's automated QA runner. Keeping
// this dependency next to the Android release tasks ensures analyzer errors or
// failing Flutter tests can never produce a distributable artifact, even when
// the workflow itself only invokes `flutter build`.
if (System.getenv("GITHUB_ACTIONS") == "true") {
    def flutterExecutable = new File(System.getenv("FLUTTER_ROOT"), "bin/flutter")
    def qualityMarker = rootProject.file("../build/ci-quality-gate.ok")
    def ciQualityGate = tasks.register("ciQualityGate", Exec) {
        group = "verification"
        description = "Runs Flutter analysis and the complete automated test suite."
        workingDir rootProject.file("..")
        inputs.files(rootProject.fileTree("../lib") { include "**/*.dart" })
        inputs.files(rootProject.fileTree("../test") { include "**/*.dart" })
        inputs.file(rootProject.file("../pubspec.yaml"))
        inputs.file(rootProject.file("../pubspec.lock"))
        outputs.file(qualityMarker)
        environment "FLUTTER_ALREADY_LOCKED", "true"
        environment "PATH", "${flutterExecutable.parentFile.absolutePath}:${System.getenv('PATH')}"
        commandLine "bash", rootProject.file("../tool/ci_quality_gate.sh").absolutePath
        doLast {
            qualityMarker.parentFile.mkdirs()
            qualityMarker.text = "passed\n"
        }
    }
    tasks.matching { task ->
        (task.name.startsWith("assemble") || task.name.startsWith("bundle")) &&
            task.name.endsWith("Release")
    }.configureEach { dependsOn(ciQualityGate) }
}

// =====================================================================
// 🛠️ رفع تداخل کلاس‌های AIDL بین دو SDK پرداخت (Poolakey و Myket):
//
// هر دو کتابخانه کلاس com.android.vending.billing.IInAppBillingService
// را باندل می‌کنند (هر دو از نمونه‌کد TrivialDrive گوگل مشتق شده‌اند) و
// Gradle در :app:checkReleaseDuplicateClasses بیلد release را می‌شکست.
//
// این کلاس را نمی‌شود با exclude عادی حذف کرد چون داخل خود AAR است.
// مقایسهٔ فایل‌های AIDL دو کتابخانه نشان می‌دهد ۷ متد اول هر دو دقیقاً
// یکسان است (isBillingSupported، getSkuDetails، getBuyIntent،
// getPurchases، consumePurchase، getBuyIntentV2، getPurchaseConfig) و
// مایکت فقط از همین ۷ متد استفاده می‌کند؛ Poolakey سه متد اضافهٔ مخصوص
// بازار را دارد (getBuyIntentV3 و ...) که فقط خودش صدا می‌زند.
// بنابراین کپی Poolakey نگه داشته می‌شود و کپی داخل AAR مایکت هنگام
// بیلد حذف می‌شود: هر دو SDK با همان یک نسخه کار می‌کنند (کدهای
// تراکنش AIDL بر اساس ترتیب متدها یکسان است).
//
// پیاده‌سازی: وابستگی اصلی JitPack فقط برای کامپایل می‌ماند؛ برای
// runtime یک نسخهٔ بازبسته‌بندی‌شده از همان AAR (بدون ۴ کلاس
// com/android/vending/billing/*) ساخته و جایگزین می‌شود.
// =====================================================================
def myketBillingVersion = "1.19"
def myketBillingModule = [group: "com.github.myketstore", module: "myket-billing-client"]

// فقط خود AAR مایکت (بدون وابستگی‌های تراکنزیو) برای بازبسته‌بندی.
def myketOriginalConfig = configurations.detachedConfiguration(
    dependencies.create("com.github.myketstore:myket-billing-client:${myketBillingVersion}")
)
myketOriginalConfig.transitive = false

def repackMyketAar = tasks.register("repackMyketAar") {
    description = "Repackages the Myket billing AAR without the duplicate Google AIDL classes"
    def outputFile = layout.buildDirectory.file("repacked/myket-billing-client-${myketBillingVersion}.aar")
    inputs.files(myketOriginalConfig)
    outputs.file(outputFile)
    doLast {
        def aar = myketOriginalConfig.singleFile
        def out = outputFile.get().asFile
        out.parentFile.mkdirs()

        def copyBytes = { InputStream input, OutputStream output ->
            byte[] buffer = new byte[16384]
            int read
            while ((read = input.read(buffer)) > 0) {
                output.write(buffer, 0, read)
            }
        }

        // checkReleaseDuplicateClasses دقیقاً همین ۴ کلاس را گزارش می‌داد؛
        // بقیهٔ کلاس‌های احتمالی همان پکیج (که در Poolakey نیستند) حفظ می‌شوند
        // تا SDK مایکت در زمان اجرا چیزی کم نداشته باشد.
        def duplicateAidlClasses = [
            'com/android/vending/billing/IInAppBillingService.class',
            'com/android/vending/billing/IInAppBillingService$Default.class',
            'com/android/vending/billing/IInAppBillingService$Stub.class',
            'com/android/vending/billing/IInAppBillingService$Stub$Proxy.class',
        ] as Set
        int dropped = 0

        def zf = new ZipFile(aar)
        def zout = new ZipOutputStream(new FileOutputStream(out))
        try {
            // ۱) همهٔ ورودی‌های AAR به‌جز classes.jar را دست‌نخورده کپی کن.
            zf.entries().each { sourceEntry ->
                if (sourceEntry.name == "classes.jar") {
                    return
                }
                zout.putNextEntry(new ZipEntry(sourceEntry.name))
                copyBytes(zf.getInputStream(sourceEntry), zout)
                zout.closeEntry()
            }

            // ۲) classes.jar را در حافظه فیلتر کن و بعد به AAR خروجی بنویس.
            def filteredClasses = new ByteArrayOutputStream()
            def filteredZip = new ZipOutputStream(filteredClasses)
            try {
                def jin = new ZipInputStream(zf.getInputStream(zf.getEntry("classes.jar")))
                try {
                    def innerEntry
                    while ((innerEntry = jin.nextEntry) != null) {
                        if (duplicateAidlClasses.contains(innerEntry.name)) {
                            dropped++
                            logger.warn("  [repackMyketAar] dropped ${innerEntry.name}")
                            continue
                        }
                        if (innerEntry.name.startsWith("com/android/vending/billing/")) {
                            logger.warn("  [repackMyketAar] kept extra vending class (not in Poolakey): ${innerEntry.name}")
                        }
                        filteredZip.putNextEntry(new ZipEntry(innerEntry.name))
                        copyBytes(jin, filteredZip)
                        filteredZip.closeEntry()
                    }
                } finally {
                    jin.close()
                }
            } finally {
                filteredZip.close()
            }
            zout.putNextEntry(new ZipEntry("classes.jar"))
            zout.write(filteredClasses.toByteArray())
            zout.closeEntry()
        } finally {
            zout.close()
            zf.close()
        }

        if (dropped != 4) {
            throw new GradleException(
                "Expected to drop 4 duplicate com.android.vending.billing classes from the Myket AAR but dropped ${dropped}"
            )
        }
        logger.lifecycle("Repacked Myket AAR without com.android.vending.billing.* (${dropped} classes dropped)")
    }
}

// در مسیر runtime به‌جای AAR اصلی مایکت، نسخهٔ بازبسته‌بندی‌شده قرار
// می‌گیرد تا تداخل کلاس‌های AIDL با Poolakey پیش نیاید.
// Flavoring changes configuration names (for example,
// myketReleaseRuntimeClasspath), so apply the replacement to every runtime
// classpath instead of relying on the former unflavored names.
configurations.configureEach { configuration ->
    if (configuration.name.endsWith("RuntimeClasspath")) {
        configuration.exclude group: myketBillingModule.group,
            module: myketBillingModule.module
    }
}

dependencies {
    // Test-only crypto/JSON coverage; these do not ship in the APK.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"

    // Poolakey is the official open-source Cafe Bazaar billing client.
    implementation "com.github.cafebazaar.Poolakey:poolakey:2.2.0"
    // Myket's official open-source billing client (same JitPack repo).
    // The ads-identifier transitive dependency is excluded: this is a kids app
    // with a "no advertising ID, no tracking" privacy promise, and the billing
    // flow does not need it.
    implementation("com.github.myketstore:myket-billing-client:${myketBillingVersion}") {
        exclude group: "com.google.android.gms", module: "play-services-ads-identifier"
    }
    // نسخهٔ بازبسته‌بندی‌شدهٔ AAR مایکت برای runtime (توضیح بالا).
    runtimeOnly files(repackMyketAar)
    // دیالوگ نصب مایکت در SDK از BottomSheet متریال استفاده می‌کند؛ چون
    // AAR بازبسته‌بندی‌شده POM ندارد، متریال باید صریحاً اینجا بیاید.
    implementation "com.google.android.material:material:1.12.0"
    // AppCompat for uCrop Activity & theme support
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.annotation:annotation:1.7.1"
}
