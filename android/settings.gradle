pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP 8.6.0 (به‌همراه Gradle 8.7): لازم برای مصرف AAR کتابخانهٔ
    // Myket Billing Client نسخهٔ 1.19 که با AGP 8.6.0 ساخته شده و در
    // متادیتایش minAndroidGradlePluginVersion=8.6.0 ثبت کرده است.
    // AGP 8.1.0 قدیمی در checkReleaseAarMetadata بیلد را قرمز می‌کرد.
    id "com.android.application" version "8.6.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
