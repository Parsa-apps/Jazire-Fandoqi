// ===== TEMP-DIAG: relay build failures to CI annotations (safe to remove) =====
def diagBuffer = new StringBuilder()
try {
    println "::notice title=diag-ping-root::root-build-gradle-ok"
} catch (Throwable ignored) {
}
try {
    def logging = gradle.getLogging()
    def listener = { event ->
        try {
            def m = event.formattedMessage
            if (m != null) {
                diagBuffer.append(m)
                if (diagBuffer.length() > 24000) {
                    diagBuffer.delete(0, diagBuffer.length() - 18000)
                }
            }
        } catch (Throwable ignored) {
        }
    }
    logging.addOutputEventListener(listener)
    println "::notice title=diag-ping-root::output-listener-ok"
} catch (Throwable ignored) {
    println "::notice title=diag-ping-root::output-listener-failed"
}
try {
    gradle.buildFinished { result ->
        try {
            if (result.failure != null) {
                def msg = new StringBuilder()
                def t = result.failure
                def i = 0
                while (t != null && i < 8) {
                    msg.append("[").append(t.getClass().getSimpleName()).append("] ")
                    def m = t.getMessage()
                    msg.append(m == null ? "(no message)" : m)
                    msg.append("\n")
                    t = t.getCause()
                    i = i + 1
                }
                def tail = diagBuffer.toString()
                if (tail.length() > 12000) {
                    tail = tail.substring(tail.length() - 12000)
                }
                msg.append("=====LOGTAIL=====\n").append(tail)
                def enc = msg.toString().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                def idx = 0
                def part = 1
                def maxChunk = 3500
                while (idx < enc.length()) {
                    def chunk = enc.substring(idx, Math.min(idx + maxChunk, enc.length()))
                    def title = part == 1 ? "gradle-failure" : ("gradle-failure-" + part)
                    println "::error title=" + title + "::" + chunk
                    idx = idx + maxChunk
                    part = part + 1
                }
            }
        } catch (Throwable ignored) {
        }
    }
} catch (Throwable ignored) {
}
// ===== END TEMP-DIAG =====

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
