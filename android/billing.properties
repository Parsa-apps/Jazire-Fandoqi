# 🏪 کلیدهای عمومی RSA فروشگاه‌ها (پرداخت درون‌برنامه‌ای)
#
# این کلیدها «عمومی» هستند و محرمانه نیستند، ولی از سورس بیرون نگه داشته
# می‌شوند تا هر انتشار بدون تغییر کد پیکربندی شود.
#
# ⚠️ قالب مقدار باید دقیقاً همان رشتهٔ Base64 باشد که پنل فروشگاه می‌دهد:
# یک خط، بدون فاصله/خط جدید، بدون چسباندن دو کلید به هم. SDK هر دو فروشگاه
# در زمان اجرا همین مقدار را Base64 decode کرده و با X509EncodedKeySpec به
# PublicKey تبدیل می‌کند؛ مقدار خراب یعنی «امضای رسید خرید معتبر نیست» و
# شکست دکمهٔ «خرید نسخه کامل». بیلد release این صحت را بررسی می‌کند
# (validateStoreBillingKeys در android/app/build.gradle).

