# 🔧 ۶.۲.۳ — مقدار قبلی این ردیف خراب بود: ۳۸۷ کاراکتر که از یک کلید کامل
# ۱۰۲۴ بیتی (۲۱۶ کاراکتر) + ۱۷۱ کاراکتر اضافی از کلیدی دیگر تشکیل شده بود؛
# Base64 آن حتی padding درست نداشت و بعد از decode، ۱۲۸ بایت اضافه بعد از
# ساختار DER می‌ماند. بخش ۱۰۲۴ بیتیِ ابتدایی همان چیزی است که پارسر کلید
# واقعاً می‌خواند، پس کوتاه‌کردن به همان مقدار رفتار را تغییر نمی‌دهد و فقط
# مقدار را استاندارد می‌کند.
