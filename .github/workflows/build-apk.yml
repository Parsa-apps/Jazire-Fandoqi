name: Build APK & AAB - جزیره فندقی v7.5


on:
  push:
    branches: [ main, master, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # When KEYSTORE_B64 is present the release is signed with the project's
      # release key; when absent the build still succeeds (debug-signed,
      # non-publishable). See android/app/build.gradle + KEYSTORE_ROTATION_GUIDE.md.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      # ==================== FIX اصلی ====================
      - name: Ensure Android folder exists
        run: |
          if [ ! -d "android" ]; then
            echo "android folder not found. Creating..."
            flutter create . --platforms android
          else
            echo "android folder exists"
          fi

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Configure release signing
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Restore the release keystore from the GitHub Secret.
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release.keystore
          chmod 600 android/release.keystore
          # build.gradle resolves storeFile relative to android/ (rootProject),
          # so key.properties is written there and points at release.keystore.
          # PKCS12 uses one password for store-integrity and key encryption, so
          # storePassword == keyPassword; alias is the fixed release-key identity.
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=fandoghi"
            echo "keyPassword=${KEYSTORE_PASSWORD}"
          } > android/key.properties
          chmod 600 android/key.properties
          echo "Release signing configured from GitHub Secrets."

      - name: Paywall regression gate
        run: >-
          flutter test --reporter expanded
          test/core/monetization_test.dart
          test/core/content_access_policy_test.dart
          test/core/half_free_rule_test.dart
          test/core/decodable_stories_test.dart
          test/core/paid_route_guard_test.dart
          test/features/shop/content_lock_test.dart

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Verify release signing (APK)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APS="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          test -n "$APS" || { echo "apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          "$APS" verify --print-certs "$APK"
          echo "APK verified: signed with the release certificate."

      - name: Build AAB (Release)
        run: flutter build appbundle --release

      - name: Record APK build identity
        run: |
          set -euo pipefail
          {
            echo "version=$(sed -n 's/^version: //p' pubspec.yaml)"
            echo "commit=${GITHUB_SHA}"
            echo "build_mode=release"
            echo "store=myket"
            echo "paywall_regression_gate=passed"
            sha256sum build/app/outputs/flutter-apk/app-release.apk
          } > build/app/outputs/flutter-apk/build-info.txt
          cat build/app/outputs/flutter-apk/build-info.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jazire_fandoqi_v7.5.1_apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/build-info.txt

      - name: Upload QA gate log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-gate-log
          path: qa-gate-log/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: jazire_fandoqi_v7.5.1_aab
          path: build/app/outputs/bundle/release/app-release.aab
