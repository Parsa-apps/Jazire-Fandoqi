name: Build APK & AAB - کودک دانا v3


on:
  push:
    branches: [ main, master, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # When KEYSTORE_B64 is present the release is signed with the project's
      # release key; when absent the build still succeeds (debug-signed,
      # non-publishable). See android/app/build.gradle + KEYSTORE_ROTATION_GUIDE.md.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      # ==================== FIX اصلی ====================
      - name: Ensure Android folder exists
        run: |
          if [ ! -d "android" ]; then
            echo "android folder not found. Creating..."
            flutter create . --platforms android
          else
            echo "android folder exists"
          fi

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Configure release signing
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Restore the release keystore from the GitHub Secret.
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release.keystore
          chmod 600 android/release.keystore
          # build.gradle resolves storeFile relative to android/ (rootProject),
          # so key.properties is written there and points at release.keystore.
          # PKCS12 uses one password for store-integrity and key encryption, so
          # storePassword == keyPassword; alias is the fixed release-key identity.
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=fandoghi"
            echo "keyPassword=${KEYSTORE_PASSWORD}"
          } > android/key.properties
          chmod 600 android/key.properties
          echo "Release signing configured from GitHub Secrets."

      - name: Build store APKs (Release)
        run: |
          flutter build apk --flavor myket --release
          flutter build apk --flavor bazaar --release

      - name: Verify store-specific billing permissions
        run: |
          set -euo pipefail
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)"
          test -n "$AAPT" || { echo "aapt not found under $ANDROID_HOME/build-tools"; exit 1; }
          MYKET="build/app/outputs/flutter-apk/app-myket-release.apk"
          BAZAAR="build/app/outputs/flutter-apk/app-bazaar-release.apk"
          "$AAPT" dump permissions "$MYKET" > /tmp/myket-permissions.txt
          "$AAPT" dump permissions "$BAZAAR" > /tmp/bazaar-permissions.txt
          grep -q 'ir.mservices.market.BILLING' /tmp/myket-permissions.txt
          ! grep -q 'com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR' /tmp/myket-permissions.txt
          grep -q 'com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR' /tmp/bazaar-permissions.txt
          ! grep -q 'ir.mservices.market.BILLING' /tmp/bazaar-permissions.txt
          echo "Store billing permissions are isolated correctly."

      - name: Verify release signing (APKs)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          set -euo pipefail
          APS="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          test -n "$APS" || { echo "apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          for APK in \
            build/app/outputs/flutter-apk/app-myket-release.apk \
            build/app/outputs/flutter-apk/app-bazaar-release.apk; do
            "$APS" verify --print-certs "$APK"
            echo "APK verified: $APK"
          done

      - name: Build store AABs (Release)
        run: |
          flutter build appbundle --flavor myket --release
          flutter build appbundle --flavor bazaar --release

      - name: Upload Myket APK
        uses: actions/upload-artifact@v4
        with:
          name: jazire-fandoqi-myket-apk
          path: build/app/outputs/flutter-apk/app-myket-release.apk

      - name: Upload Bazaar APK
        uses: actions/upload-artifact@v4
        with:
          name: jazire-fandoqi-bazaar-apk
          path: build/app/outputs/flutter-apk/app-bazaar-release.apk

      - name: Upload Myket AAB
        uses: actions/upload-artifact@v4
        with:
          name: jazire-fandoqi-myket-aab
          path: build/app/outputs/bundle/myketRelease/app-myket-release.aab

      - name: Upload Bazaar AAB
        uses: actions/upload-artifact@v4
        with:
          name: jazire-fandoqi-bazaar-aab
          path: build/app/outputs/bundle/bazaarRelease/app-bazaar-release.aab
