name: Build APK & AAB - جزیره فندقی v8.0


on:
  push:
    branches: [ main, master, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # A production release requires the official key. Missing credentials
      # fail the job; this workflow never falls back to a test/debug APK.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          RAW="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          test -n "$RAW" || { echo '::error::version not found in pubspec.yaml'; exit 1; }
          NAME="${RAW%%+*}"
          if [ "$NAME" != "$RAW" ]; then CODE="${RAW#*+}"; else CODE=""; fi
          test -n "$NAME" || { echo '::error::invalid version in pubspec.yaml'; exit 1; }
          {
            echo "raw=$RAW"
            echo "name=$NAME"
            echo "code=$CODE"
            echo "tag=v$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Release identity: $RAW (tag v$NAME)"

      - name: Require production signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" || {
            echo '::error::Official release signing is required; no test APK will be produced.'
            exit 1
          }

      - name: Production APK policy tests
        run: python3 -m unittest discover -s tool -p 'test_verify_production_apk.py' -v

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      # ==================== FIX اصلی ====================
      - name: Ensure Android folder exists
        run: |
          if [ ! -d "android" ]; then
            echo "android folder not found. Creating..."
            flutter create . --platforms android
          else
            echo "android folder exists"
          fi

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Restore the release keystore from the GitHub Secret.
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release.keystore
          chmod 600 android/release.keystore
          # build.gradle resolves storeFile relative to android/ (rootProject),
          # so key.properties is written there and points at release.keystore.
          # PKCS12 uses one password for store-integrity and key encryption, so
          # storePassword == keyPassword; alias is the fixed release-key identity.
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=fandoghi"
            echo "keyPassword=${KEYSTORE_PASSWORD}"
          } > android/key.properties
          chmod 600 android/key.properties
          keytool -exportcert -alias fandoghi -keystore android/release.keystore \
            -storepass:env KEYSTORE_PASSWORD | sha256sum | awk '{print $1}' \
            > "$RUNNER_TEMP/release-signer.sha256"
          echo "Official release signing configured."

      - name: Paywall regression gate
        run: |
          mkdir -p qa-gate-log
          set +e
          flutter test --reporter expanded \
            test/core/monetization_test.dart \
            test/core/store_vendor_test.dart \
            test/core/content_access_policy_test.dart \
            test/core/half_free_rule_test.dart \
            test/core/decodable_stories_test.dart \
            test/core/paid_route_guard_test.dart \
            test/features/shop/content_lock_test.dart \
            test/features/shop/gold_lock_collections_test.dart \
            test/features/shop/full_version_purchase_entry_test.dart \
            test/features/shop/hub_purchase_button_test.dart \
            test/features/home/island_map_buy_button_test.dart \
            test/shared/widgets/animated_gold_lock_test.dart \
            test/shared/widgets/purchase_access_status_test.dart \
            > qa-gate-log/paywall-regression.log 2>&1
          status=$?
          cat qa-gate-log/paywall-regression.log
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_annotate.py 'Paywall regression failed' qa-gate-log/paywall-regression.log
          fi
          exit "$status"

      - name: Build APK (Release)
        run: |
          mkdir -p qa-gate-log
          set +e
          flutter build apk --release --flavor myket > qa-gate-log/apk-build.log 2>&1
          status=$?
          tail -n 40 qa-gate-log/apk-build.log
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_annotate.py 'APK build tail (last 15)' qa-gate-log/apk-tail.log 2>/dev/null || true
            tail -n 15 qa-gate-log/apk-build.log | cut -c1-90 > qa-gate-log/apk-tail.log
            python3 tool/ci_annotate.py 'APK build tail (last 15)' qa-gate-log/apk-tail.log
          fi
          exit "$status"

      - name: Native production and Myket receipt tests
        run: |
          mkdir -p qa-gate-log
          set +e
          (cd android && ./gradlew --no-daemon testMyketReleaseUnitTest --console=plain) > qa-gate-log/native-receipts.log 2>&1
          status=$?
          cat qa-gate-log/native-receipts.log
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_annotate.py 'Native receipt tests failed' qa-gate-log/native-receipts.log
            tail -n 15 qa-gate-log/native-receipts.log | cut -c1-90 > qa-gate-log/native-tail.log
            python3 tool/ci_annotate.py 'Native tail (last 15)' qa-gate-log/native-tail.log
          else
            python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('build/app/test-results/testMyketReleaseUnitTest').glob('TEST-*.xml')]
          assert len(suites) >= 2, 'Expected receipt and production-build policy test results'
          total = sum(int(s.attrib['tests']) for s in suites)
          failed = sum(int(s.attrib['failures']) + int(s.attrib['errors']) for s in suites)
          skipped = sum(int(s.attrib.get('skipped', 0)) for s in suites)
          assert failed == 0 and skipped == 0 and total > 0
          print(f'::notice::Native production / Myket RSA tests: {total} passed')
          PYTEST
            status=$?
          fi
          exit "$status"

      - name: Verify release signing (APK)
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-myket-release.apk"
          APS="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          test -n "$APS" || { echo "apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          "$APS" verify --print-certs "$APK"
          APK_SIGNER_JAR="$(dirname "$APS")/lib/apksigner.jar"
          test -f "$APK_SIGNER_JAR"
          java --class-path "$APK_SIGNER_JAR" tool/VerifyApkSigner.java \
            "$APK" "$RUNNER_TEMP/release-signer.sha256" \
            | tee qa-gate-log/release-signature.txt
          echo "APK cryptographic signature and official signer verified."

      - name: Build AAB (Release)
        run: flutter build appbundle --release --flavor myket

      - name: Verify official production Myket APK
        run: |
          set -euo pipefail
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-myket-release.apk > qa-gate-log/apk-info.txt
          "$AAPT" dump xmltree build/app/outputs/flutter-apk/app-myket-release.apk AndroidManifest.xml > qa-gate-log/manifest.txt
          python3 tool/verify_production_apk.py \
            --pubspec pubspec.yaml --badging qa-gate-log/apk-info.txt \
            --manifest qa-gate-log/manifest.txt --signature qa-gate-log/release-signature.txt \
            --expected-signer "$RUNNER_TEMP/release-signer.sha256"

      - name: Record APK build identity
        run: |
          set -euo pipefail
          {
            echo "version=$(sed -n 's/^version: //p' pubspec.yaml)"
            echo "commit=${GITHUB_SHA}"
            echo "build_mode=release"
            echo "distribution=production_only"
            echo "debuggable=false"
            echo "test_only=false"
            echo "release_certificate=matched"
            echo "store=myket"
            echo "paywall_regression_gate=passed"
            echo "animated_gold_lock_tests=passed"
            echo "native_rsa_receipt_tests=passed"
            echo "native_production_policy_tests=passed"
            echo "full_version_store=myket_only"
            echo "entitlement_receipt_schema=2"
            sha256sum build/app/outputs/flutter-apk/app-myket-release.apk
          } > build/app/outputs/flutter-apk/build-info.txt
          cat build/app/outputs/flutter-apk/build-info.txt

      - name: Prepare release assets and checksums
        id: assets
        env:
          VER: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          DIST="build/dist"
          APK_NAME="jazire-fandoqi-v${VER}-myket-release.apk"
          AAB_NAME="jazire-fandoqi-v${VER}-myket-release.aab"
          mkdir -p "$DIST"
          cp build/app/outputs/flutter-apk/app-myket-release.apk "$DIST/$APK_NAME"
          cp build/app/outputs/bundle/myketRelease/app-myket-release.aab "$DIST/$AAB_NAME"
          # A checksum lets anyone detect a truncated or corrupted download:
          # the size shown by the browser must match and `sha256sum -c` must pass.
          ( cd "$DIST" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" && sha256sum "$AAB_NAME" > "$AAB_NAME.sha256" )
          {
            echo "dir=$DIST"
            echo "apk=$APK_NAME"
            echo "aab=$AAB_NAME"
            echo "apk_sha256=$(cut -d' ' -f1 "$DIST/$APK_NAME.sha256")"
            echo "aab_sha256=$(cut -d' ' -f1 "$DIST/$AAB_NAME.sha256")"
            echo "apk_bytes=$(wc -c < "$DIST/$APK_NAME")"
            echo "aab_bytes=$(wc -c < "$DIST/$AAB_NAME")"
          } >> "$GITHUB_OUTPUT"
          echo "APK: $APK_NAME ($(wc -c < "$DIST/$APK_NAME") bytes)"
          echo "AAB: $AAB_NAME ($(wc -c < "$DIST/$AAB_NAME") bytes)"
          cat "$DIST/$APK_NAME.sha256" "$DIST/$AAB_NAME.sha256"

      # The artifact itself is a signed zip on blob storage that cannot be
      # fetched from every network. Publishing the exact identity as check
      # annotations keeps the build verifiable (path, size, digest, type)
      # without downloading a single byte.
      - name: Record APK identity for verification
        env:
          VER: ${{ steps.version.outputs.name }}
          APK_NAME: ${{ steps.assets.outputs.apk }}
          APK_BYTES: ${{ steps.assets.outputs.apk_bytes }}
          APK_SHA256: ${{ steps.assets.outputs.apk_sha256 }}
          AAB_NAME: ${{ steps.assets.outputs.aab }}
          AAB_BYTES: ${{ steps.assets.outputs.aab_bytes }}
          AAB_SHA256: ${{ steps.assets.outputs.aab_sha256 }}
        run: |
          echo "build_type=release"
          echo "signing=official_release_keystore"
          echo "::notice::artifact=apk name=jazire_fandoqi_v${VER}_myket_production_apk"
          echo "::notice::artifact=apk file=${APK_NAME} bytes=${APK_BYTES} sha256=${APK_SHA256}"
          echo "::notice::artifact=aab name=jazire_fandoqi_v${VER}_myket_production_aab file=${AAB_NAME} bytes=${AAB_BYTES} sha256=${AAB_SHA256}"
          echo "::notice::apk_path=build/app/outputs/flutter-apk/app-myket-release.apk"
          echo "::notice::run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jazire_fandoqi_v${{ steps.version.outputs.name }}_myket_production_apk
          path: |
            build/app/outputs/flutter-apk/app-myket-release.apk
            build/app/outputs/flutter-apk/build-info.txt
          if-no-files-found: error

      - name: Upload QA gate log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-gate-log
          path: qa-gate-log/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: jazire_fandoqi_v${{ steps.version.outputs.name }}_myket_production_aab
          path: build/app/outputs/bundle/myketRelease/app-myket-release.aab
          if-no-files-found: error

      - name: Publish GitHub Release (APK & AAB)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          RAW: ${{ steps.version.outputs.raw }}
          DIST: ${{ steps.assets.outputs.dir }}
          APK_NAME: ${{ steps.assets.outputs.apk }}
          AAB_NAME: ${{ steps.assets.outputs.aab }}
        run: |
          set -euo pipefail
          INFO="build/app/outputs/flutter-apk/build-info.txt"
          # One clearly named APK (the old duplicate app-myket-release.apk upload
          # is gone) plus a .sha256 sidecar so downloads can be verified.
          ASSETS=(
            "$DIST/$APK_NAME" "$DIST/$APK_NAME.sha256"
            "$DIST/$AAB_NAME" "$DIST/$AAB_NAME.sha256"
            "$INFO"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "جزیره فندقی v${RAW} — نسخهٔ انتشار رسمی مایکت (APK + AAB)" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

      - name: Publish download links and checksums
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.assets.outputs.apk }}
          AAB_NAME: ${{ steps.assets.outputs.aab }}
          APK_BYTES: ${{ steps.assets.outputs.apk_bytes }}
          AAB_BYTES: ${{ steps.assets.outputs.aab_bytes }}
          APK_SHA256: ${{ steps.assets.outputs.apk_sha256 }}
          AAB_SHA256: ${{ steps.assets.outputs.aab_sha256 }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "## دانلود مستقیم (بدون زیپ) — ${TAG}"
            echo
            echo "| فایل | حجم (بایت) | SHA-256 |"
            echo "|---|---|---|"
            echo "| [${APK_NAME}](${BASE}/${APK_NAME}) | ${APK_BYTES} | \`${APK_SHA256}\` |"
            echo "| [${AAB_NAME}](${BASE}/${AAB_NAME}) | ${AAB_BYTES} | \`${AAB_SHA256}\` |"
            echo
            echo 'فایل‌های Release زیپ نیستند. اگر زیپِ آرتیفکتِ Actions هنگام استخراج خطا داد،'
            echo 'همین فایل‌ها را مستقیماً دانلود کنید و با `sha256sum -c` صحت آن‌ها را بررسی کنید.'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
