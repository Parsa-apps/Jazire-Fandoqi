name: Build APK & AAB - کودک دانا v3

# ⚠️ TEMPORARY DIAGNOSTIC WORKFLOW (arena/01a0d565 branch only)
# Runs the full test suite split into parallel chunks with the GitHub reporter
# so every failing test gets its own annotation (10 per step limit).
# Will be reverted to the real build workflow before merge.

on:
  push:
    branches: [ main, master, 'arena/**' ]
  workflow_dispatch:

jobs:
  diag-v7-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.3', channel: 'stable', cache: true }
      - run: flutter pub get
      - name: Run v7 core tests
        run: >-
          flutter test -r github --timeout 2m
          test/core/achievement_system_test.dart
          test/core/daily_xp_log_test.dart
          test/core/day_cycle_and_missions_v7_test.dart
          test/core/island_level_watcher_test.dart
          test/core/xp_system_test.dart
          test/core/parent_insights_test.dart
          test/core/growth_family_test.dart

  diag-v7-games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.3', channel: 'stable', cache: true }
      - run: flutter pub get
      - name: Run mini-game tests
        run: >-
          flutter test -r github --timeout 2m
          test/features/games/mini_games/mini_game_scaffold_test.dart
          test/features/games/mini_games/mini_games_generators_test.dart
          test/features/games/grade1_math_and_alphabet_test.dart

  diag-v7-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.3', channel: 'stable', cache: true }
      - run: flutter pub get
      - name: Run v7 UI tests
        run: >-
          flutter test -r github --timeout 2m
          test/features/cartoons/online_cartoon_gate_test.dart
          test/features/growth/island_milestone_celebration_test.dart
          test/integration_test/app_flow_test.dart
          test/app_smoke_test.dart

  diag-core-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.3', channel: 'stable', cache: true }
      - run: flutter pub get
      - name: Run remaining core tests
        run: >-
          flutter test -r github --timeout 2m
          test/core/ai_system_test.dart
          test/core/aparat_safety_test.dart
          test/core/audio_service_test.dart
          test/core/cartoon_data_test.dart
          test/core/catalog_search_test.dart
          test/core/content_access_policy_test.dart
          test/core/decodable_stories_test.dart
          test/core/drawing_album_test.dart
          test/core/educational_content_integrity_test.dart
          test/core/fandoghi_coach_test.dart
          test/core/game_data_test.dart
          test/core/grade1_math_test.dart
          test/core/growth_persian_digits_test.dart
          test/core/growth_store_test.dart
          test/core/jalali_calendar_test.dart
          test/core/life_skills_data_test.dart
          test/core/literacy_path_test.dart
          test/core/monetization_test.dart
          test/core/no_gallery_access_test.dart
          test/core/parent_pin_test.dart
          test/core/quiz_shuffle_test.dart
          test/core/store_listing_test.dart
          test/core/store_neutral_ui_test.dart
          test/core/store_vendor_test.dart
          test/core/story_read_along_test.dart
          test/core/today_path_test.dart
          test/core/weekly_engine_test.dart

  diag-features-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.3', channel: 'stable', cache: true }
      - run: flutter pub get
      - name: Run remaining feature tests
        run: >-
          flutter test -r github --timeout 2m
          test/features/games/puzzle_game_test.dart
          test/features/gateway/profile_offer_test.dart
          test/features/learning_library_screen_test.dart
          test/features/lullabies/lullaby_hub_screen_test.dart
          test/features/shop/full_version_paywall_test.dart
