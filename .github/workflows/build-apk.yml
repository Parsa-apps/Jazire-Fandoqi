name: Build APK & AAB - جزیره فندقی v7.5


on:
  push:
    branches: [ main, master, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # When KEYSTORE_B64 is present the release is signed with the project's
      # release key; when absent the build still succeeds (debug-signed,
      # non-publishable). See android/app/build.gradle + KEYSTORE_ROTATION_GUIDE.md.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      # ==================== FIX اصلی ====================
      - name: Ensure Android folder exists
        run: |
          if [ ! -d "android" ]; then
            echo "android folder not found. Creating..."
            flutter create . --platforms android
          else
            echo "android folder exists"
          fi

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Configure release signing
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Restore the release keystore from the GitHub Secret.
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release.keystore
          chmod 600 android/release.keystore
          # build.gradle resolves storeFile relative to android/ (rootProject),
          # so key.properties is written there and points at release.keystore.
          # PKCS12 uses one password for store-integrity and key encryption, so
          # storePassword == keyPassword; alias is the fixed release-key identity.
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=fandoghi"
            echo "keyPassword=${KEYSTORE_PASSWORD}"
          } > android/key.properties
          chmod 600 android/key.properties
          echo "Release signing configured from GitHub Secrets."

      # =====================================================================
      # 🏪 دو خروجی مستقل — یکی برای هر فروشگاه
      #
      # هر flavor فقط SDK پرداخت فروشگاه خودش را دارد:
      #   bazaar → Poolakey (کافه‌بازار)  |  myket → Myket Billing Client
      # به همین دلیل `--flavor` و `--dart-define=STORE_CHANNEL` در هر بیلد
      # صریح و اجباری است.
      # =====================================================================

      - name: "Build APK — Cafe Bazaar (flavor: bazaar)"
        run: |
          flutter build apk --flavor bazaar --release \
            --dart-define=STORE_CHANNEL=bazaar

      - name: "Build APK — Myket (flavor: myket)"
        run: |
          flutter build apk --flavor myket --release \
            --dart-define=STORE_CHANNEL=myket

      - name: "Build AAB — Cafe Bazaar (flavor: bazaar)"
        run: |
          flutter build appbundle --flavor bazaar --release \
            --dart-define=STORE_CHANNEL=bazaar

      - name: "Build AAB — Myket (flavor: myket)"
        run: |
          flutter build appbundle --flavor myket --release \
            --dart-define=STORE_CHANNEL=myket

      - name: "Verify release signing (both stores)"
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          set -euo pipefail
          APS="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          test -n "$APS" || { echo "apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          for APK in build/app/outputs/flutter-apk/app-bazaar-release.apk \
                      build/app/outputs/flutter-apk/app-myket-release.apk; do
            test -f "$APK" || { echo "missing APK: $APK"; exit 1; }
            "$APS" verify --print-certs "$APK"
            echo "APK verified: $APK"
          done

      # 🔒 اثبات جداسازی: SDK و مجوز فروشگاه رقیب نباید در آرتیفکت باشد.
      - name: "Verify store isolation (no rival SDK in the artifacts)"
        run: |
          set -uo pipefail
          STATUS=0
          check() {
            if bash tool/verify_store_isolation.sh "$1" "$2"; then
              echo "::notice title=Store isolation::$1 → OK ($2)"
            else
              echo "::error title=Store isolation::$1 → VIOLATED ($2)"
              STATUS=1
            fi
          }
          check build/app/outputs/flutter-apk/app-bazaar-release.apk bazaar
          check build/app/outputs/flutter-apk/app-myket-release.apk myket
          check build/app/outputs/bundle/bazaarRelease/app-bazaar-release.aab bazaar
          check build/app/outputs/bundle/myketRelease/app-myket-release.aab myket
          exit $STATUS

      # اگر بررسی بالا شکست خورد، این گام علت را دقیق می‌گوید (و در
      # خلاصهٔ ران هم ثبت می‌شود) تا بدون دسترسی به لاگ کامل قابل رفع باشد.
      - name: "Store isolation diagnostics"
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### 🔎 گزارش جداسازی فروشگاه"
            for f in \
              "build/app/outputs/flutter-apk/app-bazaar-release.apk|bazaar" \
              "build/app/outputs/flutter-apk/app-myket-release.apk|myket" \
              "build/app/outputs/bundle/bazaarRelease/app-bazaar-release.aab|bazaar" \
              "build/app/outputs/bundle/myketRelease/app-myket-release.aab|myket" ; do
              path="${f%%|*}"; store="${f##*|}"
              echo ""
              echo "#### $path (انتظار: $store)"
              if [ ! -f "$path" ]; then echo "  (فایل موجود نیست)"; continue; fi
              echo "  entries:"; unzip -l "$path" | awk '{print "    " $NF}' | grep -E 'AndroidManifest|classes.*\.dex' || true
              manifest="$(unzip -l "$path" | awk '{print $NF}' | grep -E '(^|/)AndroidManifest\.xml$' | head -1)"
              if [ -n "$manifest" ]; then
                echo "  manifest ($manifest) — خطوط مرتبط با فروشگاه‌ها:"
                unzip -p "$path" "$manifest" | strings -a | grep -E 'farsitel|mservices|poolakey|billingclient' | sort -u | sed 's/^/    /' || true
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: "Upload APK — Cafe Bazaar"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jazire_fandoqi_v7.5.0_apk_bazaar
          path: build/app/outputs/flutter-apk/app-bazaar-release.apk

      - name: "Upload APK — Myket"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jazire_fandoqi_v7.5.0_apk_myket
          path: build/app/outputs/flutter-apk/app-myket-release.apk

      - name: "Upload AAB — Cafe Bazaar"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jazire_fandoqi_v7.5.0_aab_bazaar
          path: build/app/outputs/bundle/bazaarRelease/app-bazaar-release.aab

      - name: "Upload AAB — Myket"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jazire_fandoqi_v7.5.0_aab_myket
          path: build/app/outputs/bundle/myketRelease/app-myket-release.aab

      - name: Upload QA gate log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-gate-log
          path: qa-gate-log/
          if-no-files-found: ignore
          retention-days: 3
