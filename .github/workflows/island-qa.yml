name: Island QA - analyze, test, build

# Real verification for the island redesign: static analysis, the full
# widget/unit test suite and a release APK build. Kept separate from the
# store build workflow so QA failures are visible without changing the
# release pipeline configuration.
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (full report)
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          status=$?
          # Republish findings as check annotations so they are visible
          # in the API/UI even when raw job logs cannot be downloaded.
          # Findings in the redesigned island files come first.
          total=$(grep -c ' • ' analyze.txt || true)
          errors=$(grep -c '^ *error •' analyze.txt || true)
          warnings=$(grep -c '^ *warning •' analyze.txt || true)
          island=$(grep ' • ' analyze.txt | grep -cE 'island_map|island_world_style|island_node_test' || true)
          echo "::notice::analyze exit=$status total=$total errors=$errors warnings=$warnings island-findings=$island"
          # The repository carries hundreds of pre-existing info-level
          # lints, so this step reports but does not gate. The hard gate
          # is the scoped analyze step below.
          true
          emit() {
            local n=0
            while IFS= read -r raw; do
              sev=$(printf '%s' "$raw" | awk -F' • ' '{print $1}' | xargs)
              msg=$(printf '%s' "$raw" | awk -F' • ' '{print $2}')
              loc=$(printf '%s' "$raw" | awk -F' • ' '{print $3}')
              code=$(printf '%s' "$raw" | awk -F' • ' '{print $4}')
              file=$(printf '%s' "$loc" | rev | cut -d: -f3- | rev)
              line=$(printf '%s' "$loc" | rev | cut -d: -f2 | rev)
              col=$(printf '%s' "$loc" | rev | cut -d: -f1 | rev)
              case "$sev" in
                error)   level=error ;;
                warning) level=warning ;;
                *)       level=notice ;;
              esac
              relpath="${file#"$GITHUB_WORKSPACE"/}"
              echo "::$level file=$relpath,line=$line,col=$col::$code $msg"
              n=$((n+1)); [ "$n" -ge 22 ] && break
            done
          }
          grep ' • ' analyze.txt | grep -E '^ *error •' | emit || true
          grep ' • ' analyze.txt | grep -E '^ *warning •' | emit || true
          grep ' • ' analyze.txt | grep -E 'island_map|island_world_style|island_node_test' | emit || true
          grep ' • ' analyze.txt | grep -vE 'island_map|island_world_style|island_node_test' | emit || true

      # Hard gate: the redesigned island code must be analyzer-clean.
      - name: Flutter analyze (island scope gate)
        run: >-
          flutter analyze
          lib/features/home/widgets/island_map
          lib/app/island_world_style.dart
          test/features/home/island_node_test.dart

      - name: Flutter test
        run: |
          set +e
          flutter test --reporter expanded > test-output.txt 2>&1
          status=$?
          # Republish failing tests as check annotations so they are
          # visible in the API/UI even when raw job logs cannot be
          # downloaded. The step still gates on the real exit code.
          echo "::notice::flutter test exit=$status"
          grep -E '\[E\]' test-output.txt | head -30 | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '%' | cut -c1-280)
            echo "::error::$clean"
          done
          # Full island-test output, base64-chunked into notices so the
          # exact failure text survives the trip through the API.
          flutter test --reporter expanded test/features/home/island_node_test.dart > island-test-output.txt 2>&1 || true
          base64 -w0 island-test-output.txt > island-test.b64
          split -b 900 island-test.b64 island-chunk-
          n=0
          for f in island-chunk-*; do
            n=$((n+1))
            echo "::notice::ISLAND-B64-$n $(cat "$f")"
          done
          echo "::notice::ISLAND-B64-END chunks=$n"
          # Same for the smoke suite, which intermittently fails to load.
          flutter test --reporter expanded test/app_smoke_test.dart > smoke-output.txt 2>&1 || true
          tail -c 6000 smoke-output.txt | base64 -w0 > smoke.b64
          split -b 900 smoke.b64 smoke-chunk-
          n=0
          for f in smoke-chunk-*; do
            n=$((n+1))
            echo "::notice::SMOKE-B64-$n $(cat "$f")"
          done
          echo "::notice::SMOKE-B64-END chunks=$n"
          grep -E 'Some tests failed|All tests passed' test-output.txt | tail -1 | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '%' | cut -c1-280)
            echo "::notice::$clean"
          done
          exit $status

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: island-qa-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # One-off baseline: run the test files that fail in files untouched
  # by the island redesign against the pre-change commit, to prove
  # whether those failures pre-date the redesign.
  baseline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pre-change commit
        uses: actions/checkout@v4
        with:
          ref: f9bb102f53a788616b369d5a1a30e57992d88f0a

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run suspect test files on the base commit
        run: |
          set +e
          flutter test --reporter expanded \
            test/shared/fandoghi_coach_overlay_test.dart \
            test/features/learning_library_screen_test.dart \
            test/features/gateway/profile_offer_test.dart \
            test/features/home/report_card_tab_test.dart \
            test/integration_test/app_flow_test.dart \
            > baseline-output.txt 2>&1
          status=$?
          echo "::notice::baseline flutter test exit=$status"
          grep -E '\[E\]|Some tests failed|All tests passed' baseline-output.txt | head -30 | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '%' | cut -c1-280)
            echo "::error::$clean"
          done
          # This job only gathers baseline evidence; it never gates.
          true
