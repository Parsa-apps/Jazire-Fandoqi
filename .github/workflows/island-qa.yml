name: Island QA - analyze, test, build

# Real verification for the island redesign: static analysis, the full
# widget/unit test suite and a release APK build. Kept separate from the
# store build workflow so QA failures are visible without changing the
# release pipeline configuration.
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: |
          set +e
          flutter analyze --machine > analyze-machine.txt 2>&1
          status=$?
          # Republish findings as check annotations so they are visible
          # in the API/UI even when raw job logs cannot be downloaded.
          while IFS='|' read -r severity _type code path line col _len msg; do
            case "$severity" in
              ERROR)   level=error ;;
              WARNING) level=warning ;;
              *)       level=notice ;;
            esac
            relpath="${path#"$GITHUB_WORKSPACE"/}"
            echo "::$level file=$relpath,line=$line,col=$col::$code $msg"
          done < analyze-machine.txt
          echo "flutter analyze exit code: $status"
          exit $status

      - name: Flutter test
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: island-qa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
