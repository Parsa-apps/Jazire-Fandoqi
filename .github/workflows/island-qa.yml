name: Island QA - analyze, test, build

# Real verification for the island redesign: static analysis, the full
# widget/unit test suite and a release APK build. Kept separate from the
# store build workflow so QA failures are visible without changing the
# release pipeline configuration.
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (full report)
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          status=$?
          # Republish findings as check annotations so they are visible
          # in the API/UI even when raw job logs cannot be downloaded.
          # Findings in the redesigned island files come first.
          total=$(grep -c ' • ' analyze.txt || true)
          errors=$(grep -c '^ *error •' analyze.txt || true)
          warnings=$(grep -c '^ *warning •' analyze.txt || true)
          island=$(grep ' • ' analyze.txt | grep -cE 'island_map|island_world_style|island_node_test' || true)
          echo "::notice::analyze exit=$status total=$total errors=$errors warnings=$warnings island-findings=$island"
          # The repository carries hundreds of pre-existing info-level
          # lints, so this step reports but does not gate. The hard gate
          # is the scoped analyze step below.
          true
          emit() {
            local n=0
            while IFS= read -r raw; do
              sev=$(printf '%s' "$raw" | awk -F' • ' '{print $1}' | xargs)
              msg=$(printf '%s' "$raw" | awk -F' • ' '{print $2}')
              loc=$(printf '%s' "$raw" | awk -F' • ' '{print $3}')
              code=$(printf '%s' "$raw" | awk -F' • ' '{print $4}')
              file=$(printf '%s' "$loc" | rev | cut -d: -f3- | rev)
              line=$(printf '%s' "$loc" | rev | cut -d: -f2 | rev)
              col=$(printf '%s' "$loc" | rev | cut -d: -f1 | rev)
              case "$sev" in
                error)   level=error ;;
                warning) level=warning ;;
                *)       level=notice ;;
              esac
              relpath="${file#"$GITHUB_WORKSPACE"/}"
              echo "::$level file=$relpath,line=$line,col=$col::$code $msg"
              n=$((n+1)); [ "$n" -ge 22 ] && break
            done
          }
          grep ' • ' analyze.txt | grep -E '^ *(error|warning) •' | emit || true
          grep ' • ' analyze.txt | grep -E 'island_map|island_world_style|island_node_test' | emit || true
          grep ' • ' analyze.txt | grep -vE 'island_map|island_world_style|island_node_test' | emit || true

      # Hard gate: the redesigned island code must be analyzer-clean.
      - name: Flutter analyze (island scope gate)
        run: >-
          flutter analyze
          lib/features/home/widgets/island_map
          lib/app/island_world_style.dart
          test/features/home/island_node_test.dart

      - name: Flutter test
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: island-qa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
