name: Magic Auto Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Structure & Build
        run: |
          # ۱. ساخت یک پوشه امن در بیرون از پروژه برای بک‌آپ
          mkdir -p /tmp/kudakeiran_backup
          
          # ۲. کپی کردن فایل‌های تو به اون پوشه امن
          cp -r lib /tmp/kudakeiran_backup/
          cp pubspec.yaml /tmp/kudakeiran_backup/
          
          # ۳. حالا با خیال راحت همه چیز رو پاک می‌کنیم تا فلاتر پروژه خام بسازه
          rm -rf .!!
          rm -rf *
          
          # ۴. ساخت پروژه استاندارد فلاتر
          flutter create --project-name kudakeiran --platforms android .
          
          # ۵. پاک کردن فایل‌های پیش‌فرض و برگرداندن فایل‌های اصلی تو از پوشه امن
          rm -rf lib pubspec.yaml
          cp -r /tmp/kudakeiran_backup/lib .
          cp /tmp/kudakeiran_backup/pubspec.yaml .
          
          # ۶. بیلد نهایی
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KudakeIran-Final-App
          path: build/app/outputs/flutter-apk/app-release.apk
