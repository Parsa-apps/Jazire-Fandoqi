name: KudakeIran Ultimate Success
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Master Build Engine
        run: |
          # ۱. پاکسازی کامل محیط کار
          rm -rf /tmp/builder_app
          
          # ۲. ساخت پروژه خام فلاتر در یک مسیر جدید
          flutter create --project-name kudakeiran /tmp/builder_app
          
          # ۳. ورود به پوشه ساخته شده
          cd /tmp/builder_app
          
          # ۴. اصلاح نسخه کاتلین (با روشی که اگر فایل نبود هم ارور ندهد)
          if [ -f android/build.gradle ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/' android/build.gradle
          fi
          
          # ۵. جایگزینی کدهای اصلی استارتاپ تو
          rm -rf lib
          cp -r $GITHUB_WORKSPACE/lib .
          cp $GITHUB_WORKSPACE/pubspec.yaml .
          
          # ۶. دریافت پکیج‌ها و بیلد نهایی
          flutter pub get
          flutter build apk --release

          # ۷. انتقال فایل ساخته شده به پوشه خروجی گیت‌هاب
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/kudakeiran_final.apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: KudakeIran-App-v1
          path: output/kudakeiran_final.apk
