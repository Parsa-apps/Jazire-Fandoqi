name: APK Delivery (chunked branch transport)

# یک‌بارمصرف: APK رسمی امضاشده را می‌سازد و چون آرتیفکت Actions و Release
# پشت هاست‌هایی‌اند که از برخی شبکه‌ها در دسترس نیستند، فایل را در قالب
# قطعه‌های ۴۰ مگابایتی روی یک برنچ یتیم (apk-delivery/<version>) پوش می‌کند
# تا با git قابل دریافت باشد. پس از تحویل، برنچ و این ورک‌فلو حذف می‌شوند.

on:
  push:
    tags:
      - 'apk-delivery/**'

jobs:
  deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          RAW="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          NAME="${RAW%%+*}"
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "branch=apk-delivery/v${NAME}" >> "$GITHUB_OUTPUT"
          echo "Release identity: $RAW"

      - name: Require production signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" || {
            echo '::error::Official release signing is required.'; exit 1;
          }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then flutter create . --platforms android; fi
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release.keystore
          chmod 600 android/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=fandoghi"
            echo "keyPassword=${KEYSTORE_PASSWORD}"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Build APK (Release, myket)
        run: flutter build apk --release --flavor myket

      - name: Verify release signing
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-myket-release.apk"
          APS="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          "$APS" verify --print-certs "$APK"

      - name: Split APK and push orphan delivery branch
        env:
          VER: ${{ steps.version.outputs.name }}
          DELIVERY_BRANCH: ${{ steps.version.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-myket-release.apk"
          APK_NAME="jazire-fandoqi-v${VER}-myket-release.apk"
          test -f "$APK"
          STAGE="$(mktemp -d)"
          cp "$APK" "$STAGE/$APK_NAME"
          (
            cd "$STAGE"
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
            # قطعه‌ها حداکثر ۴۰MB تا از محدودیت ۱۰۰MB گیت‌هاب فاصله امن بگیرند
            split -b 40m -d -a 2 "$APK_NAME" "$APK_NAME.part"
            rm "$APK_NAME"
            PARTS="$(ls "${APK_NAME}".part* | wc -l | tr -d ' ')"
            {
              echo "# تحویل APK نسخه ${VER} — برنچ موقت"
              echo
              echo "فایل APK به قطعه‌های ۴۰ مگابایتی شکسته شده (انتقال از طریق"
              echo "بلاب استوریج Actions در همه شبکه‌ها در دسترس نیست)."
              echo
              echo "## بازسازی فایل"
              echo
              echo "لینوکس / macOS:"
              echo '```bash'
              echo "cat ${APK_NAME}.part* > ${APK_NAME}"
              echo "sha256sum -c ${APK_NAME}.sha256"
              echo '```'
              echo
              echo "ویندوز (cmd):"
              echo '```cmd'
              echo "copy /b ${APK_NAME}.part00+${APK_NAME}.part01+${APK_NAME}.part02 ${APK_NAME}"
              echo "certutil -hashfile ${APK_NAME} SHA256"
              echo '```'
              echo
              echo "تعداد قطعه‌ها: ${PARTS}"
              echo "امضا: کلید رسمی مایکت (apksigner verify روی CI پاس شد)"
            } > README.md
            git init -b main
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -q -m "chore(delivery): APK ${VER} split into 40MB chunks"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push -f origin "main:${DELIVERY_BRANCH}"
          )
          echo "::notice::pushed delivery branch ${DELIVERY_BRANCH}"
          ls -lh "$STAGE"
