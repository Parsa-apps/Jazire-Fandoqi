name: Build Bazaar APK & AAB - جزیره فندقی v7.5

# Dedicated Cafe Bazaar release channel. It reuses the official release key
# but builds only the `bazaar` flavor, so the artifact contains Poolakey and
# the Bazaar billing permission — never Myket's SDK or permission.
on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'arena/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require production signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" || {
            echo '::error::Official release signing is required; no test APK will be produced.'
            exit 1
          }

      - name: Production APK policy tests
        run: python3 -m unittest discover -s tool -p 'test_verify_production_apk.py' -v

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release.keystore
          chmod 600 android/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=fandoghi"
            echo "keyPassword=${KEYSTORE_PASSWORD}"
          } > android/key.properties
          chmod 600 android/key.properties
          keytool -exportcert -alias fandoghi -keystore android/release.keystore \
            -storepass:env KEYSTORE_PASSWORD | sha256sum | awk '{print $1}' \
            > "$RUNNER_TEMP/release-signer.sha256"
          echo "Official release signing configured."

      - name: Paywall and store-isolation regression gate
        run: |
          mkdir -p qa-gate-log
          set +e
          flutter test --reporter expanded \
            test/core/monetization_test.dart \
            test/core/store_vendor_test.dart \
            test/core/store_policy_test.dart \
            test/core/store_listing_test.dart \
            test/core/store_neutral_ui_test.dart \
            test/core/content_access_policy_test.dart \
            test/core/half_free_rule_test.dart \
            test/core/decodable_stories_test.dart \
            test/core/paid_route_guard_test.dart \
            test/features/shop/content_lock_test.dart \
            test/features/shop/gold_lock_collections_test.dart \
            test/features/shop/full_version_purchase_entry_test.dart \
            test/features/shop/hub_purchase_button_test.dart \
            test/features/shop/full_version_paywall_test.dart \
            test/features/home/island_map_buy_button_test.dart \
            test/shared/widgets/animated_gold_lock_test.dart \
            test/shared/widgets/purchase_access_status_test.dart \
            > qa-gate-log/paywall-regression.log 2>&1
          status=$?
          cat qa-gate-log/paywall-regression.log
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_annotate.py 'Bazaar paywall regression failed' qa-gate-log/paywall-regression.log
          fi
          exit "$status"

      - name: Build Bazaar APK (Release)
        run: |
          mkdir -p qa-gate-log
          set +e
          flutter build apk --release --flavor bazaar > qa-gate-log/apk-build.log 2>&1
          status=$?
          tail -n 40 qa-gate-log/apk-build.log
          if [ "$status" -ne 0 ]; then
            tail -n 15 qa-gate-log/apk-build.log | cut -c1-90 > qa-gate-log/apk-tail.log
            python3 tool/ci_annotate.py 'Bazaar APK build tail (last 15)' qa-gate-log/apk-tail.log
          fi
          exit "$status"

      - name: Native Bazaar production and receipt tests
        run: |
          mkdir -p qa-gate-log
          set +e
          (cd android && ./gradlew --no-daemon testBazaarReleaseUnitTest --console=plain) > qa-gate-log/native-receipts.log 2>&1
          status=$?
          cat qa-gate-log/native-receipts.log
          if [ "$status" -ne 0 ]; then
            python3 tool/ci_annotate.py 'Native Bazaar receipt tests failed' qa-gate-log/native-receipts.log
            tail -n 15 qa-gate-log/native-receipts.log | cut -c1-90 > qa-gate-log/native-tail.log
            python3 tool/ci_annotate.py 'Native tail (last 15)' qa-gate-log/native-tail.log
          else
            python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('build/app/test-results/testBazaarReleaseUnitTest').glob('TEST-*.xml')]
          assert len(suites) >= 2, 'Expected receipt and production-build policy test results'
          total = sum(int(s.attrib['tests']) for s in suites)
          failed = sum(int(s.attrib['failures']) + int(s.attrib['errors']) for s in suites)
          skipped = sum(int(s.attrib.get('skipped', 0)) for s in suites)
          assert failed == 0 and skipped == 0 and total > 0
          print(f'::notice::Native production / Bazaar RSA tests: {total} passed')
          PYTEST
            status=$?
          fi
          exit "$status"

      - name: Verify release signing (APK)
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-bazaar-release.apk"
          APS="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          test -n "$APS" || { echo "apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          "$APS" verify --print-certs "$APK"
          APK_SIGNER_JAR="$(dirname "$APS")/lib/apksigner.jar"
          test -f "$APK_SIGNER_JAR"
          java --class-path "$APK_SIGNER_JAR" tool/VerifyApkSigner.java \
            "$APK" "$RUNNER_TEMP/release-signer.sha256" \
            | tee qa-gate-log/release-signature.txt
          echo "APK cryptographic signature and official signer verified."

      - name: Build Bazaar AAB (Release)
        run: flutter build appbundle --release --flavor bazaar

      - name: Verify official production Bazaar APK
        run: |
          set -euo pipefail
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)"
          test -n "$AAPT"
          APK="build/app/outputs/flutter-apk/app-bazaar-release.apk"
          "$AAPT" dump badging "$APK" > qa-gate-log/apk-info.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > qa-gate-log/manifest.txt
          # Evidence for the store review: the artifact must not request a
          # competing market's billing permission.
          "$AAPT" dump permissions "$APK" | tee qa-gate-log/permissions.txt
          if grep -Fq 'ir.mservices.market.BILLING' qa-gate-log/permissions.txt; then
            echo '::error::Bazaar APK requests the Myket billing permission'
            exit 1
          fi
          grep -Fq 'com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR' qa-gate-log/permissions.txt
          python3 tool/verify_production_apk.py \
            --pubspec pubspec.yaml --badging qa-gate-log/apk-info.txt \
            --manifest qa-gate-log/manifest.txt --signature qa-gate-log/release-signature.txt \
            --expected-signer "$RUNNER_TEMP/release-signer.sha256" --store bazaar

      - name: Record APK build identity
        run: |
          set -euo pipefail
          {
            echo "version=$(sed -n 's/^version: //p' pubspec.yaml)"
            echo "commit=${GITHUB_SHA}"
            echo "build_mode=release"
            echo "distribution=production_only"
            echo "debuggable=false"
            echo "test_only=false"
            echo "release_certificate=matched"
            echo "store=bazaar"
            echo "paywall_regression_gate=passed"
            echo "native_rsa_receipt_tests=passed"
            echo "native_production_policy_tests=passed"
            echo "full_version_store=bazaar_only"
            echo "myket_billing_permission=absent"
            echo "entitlement_receipt_schema=2"
            sha256sum build/app/outputs/flutter-apk/app-bazaar-release.apk
          } > build/app/outputs/flutter-apk/build-info-bazaar.txt
          cat build/app/outputs/flutter-apk/build-info-bazaar.txt

      - name: Upload Bazaar APK
        uses: actions/upload-artifact@v4
        with:
          name: jazire_fandoqi_v7.5.6_bazaar_production_apk
          path: |
            build/app/outputs/flutter-apk/app-bazaar-release.apk
            build/app/outputs/flutter-apk/build-info-bazaar.txt
            qa-gate-log/permissions.txt

      - name: Upload Bazaar AAB
        uses: actions/upload-artifact@v4
        with:
          name: jazire_fandoqi_v7.5.6_bazaar_production_aab
          path: build/app/outputs/bundle/bazaarRelease/app-bazaar-release.aab

      - name: Publish GitHub Release (Bazaar APK & AAB)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v7.5.6-bazaar"
          APK="build/app/outputs/flutter-apk/app-bazaar-release.apk"
          AAB="build/app/outputs/bundle/bazaarRelease/app-bazaar-release.aab"
          INFO="build/app/outputs/flutter-apk/build-info-bazaar.txt"
          cp "$APK" "jazire-fandoqi-v7.5.6-bazaar-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$APK" \
              "jazire-fandoqi-v7.5.6-bazaar-release.apk" \
              "$AAB" \
              "$INFO" \
              --clobber
          else
            gh release create "$TAG" \
              "$APK" \
              "jazire-fandoqi-v7.5.6-bazaar-release.apk" \
              "$AAB" \
              "$INFO" \
              --title "جزیره فندقی v7.5.6+29 — نسخهٔ اختصاصی کافه‌بازار (APK + AAB)" \
              --notes-file docs/BAZAAR_EDITION_7_5_6_FA.md
          fi

      - name: Upload QA gate log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-qa-gate-log
          path: qa-gate-log/
          if-no-files-found: ignore
          retention-days: 3
