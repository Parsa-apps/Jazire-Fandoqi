name: Diagnostic tests (temporary)

on:
  push:
    branches: [ 'arena/1c5914bd-jazire-fandoqi' ]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run failing test files (diagnostic)
        run: bash tool/diag_tests.sh
