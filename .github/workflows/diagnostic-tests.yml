name: Diagnostic tests (temporary)

on:
  push:
    branches: [ 'arena/1c5914bd-jazire-fandoqi' ]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: test/features/tutorial/app_tutorial_screen_test.dart
            watchdog: 2m
          - file: test/features/gateway/profile_offer_test.dart
            watchdog: 2m
          - file: test/integration_test/app_flow_test.dart
            watchdog: 2m
          - file: test/features/cartoons/online_cartoon_gate_test.dart
            watchdog: 5m
          - file: test/features/games/mini_games/mini_game_scaffold_test.dart
            watchdog: 5m
          - file: tool/diag/reload_probe_test.dart
            watchdog: 5m
          - file: tool/diag/hint_fine_test.dart
            watchdog: 5m
          - file: tool/diag/multi_select_test.dart
            watchdog: 5m
    name: ${{ matrix.file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run single test file (diagnostic)
        run: bash tool/diag_tests.sh '${{ matrix.file }}' '${{ matrix.watchdog }}'
