name: Diagnostic tests (temporary)

on:
  push:
    branches: [ 'arena/1c5914bd-jazire-fandoqi' ]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: ALL
            watchdog: 14m
          - file: test/features/cartoons/online_cartoon_gate_test.dart
            watchdog: 2m
          - file: test/features/games/mini_games/mini_game_scaffold_test.dart
            watchdog: 3m
          - file: test/features/games/mini_games/mini_games_generators_test.dart
            watchdog: 2m
          - file: test/features/growth/island_milestone_celebration_test.dart
            watchdog: 2m
          - file: test/features/gateway/profile_offer_test.dart
            watchdog: 2m
          - file: test/integration_test/app_flow_test.dart
            watchdog: 2m
          - file: tool/diag/p4_hint_bisect_test.dart
            watchdog: 3m
    name: ${{ matrix.file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run single test file (diagnostic)
        run: bash tool/diag_tests.sh '${{ matrix.file }}' '${{ matrix.watchdog }}'

      - name: Upload full diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ strategy.job-index }}
          path: diag-logs/
          if-no-files-found: ignore
          retention-days: 3
